# ============================================================
# Docker Compose 本地联调/单服务调试覆盖
#
# 使用说明：
# - 本地 Docker 联调：make docker-local-up
# - 或手动执行：
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d
#
# 约定：
# - 该文件用于“其余服务在 Docker 中运行，单个业务后端或 atomic-rag 在宿主机/VSCode 中调试”的场景。
# - 需要本地调试某个同名服务时，先停掉 Docker 服务，避免宿主机调试端口冲突。
# - Sidecar 会把业务能力和 atomic-rag 调用转发到 host.docker.internal 对应的宿主机端口。
# - lightrag 暴露 9621 调试端口；atomic-rag 通过 extra_hosts 将 lightrag 解析到宿主机，
#   宿主机调试 LightRAG 时只需停止 Docker lightrag 容器即可，atomic-rag 自动走宿主机。
# ============================================================

services:
  gateway:
    ports:
      - "8000:8000"  # 开发模式对外暴露 API 端口，方便调试
  sidecar:
    ports:
      - "8001:8000"  # 开发模式对外暴露 Sidecar 端口
    environment:
      KNOWLEDGE_BASE_URL: http://host.docker.internal:8003
      BUSINESS_DOMAIN_URL: http://host.docker.internal:8005
      TASK_CENTER_URL: http://host.docker.internal:8007
      ATOMIC_RAG_URL: http://host.docker.internal:8004
      PLATFORM_URL: http://host.docker.internal:8006
    extra_hosts:
      - "host.docker.internal:host-gateway"

  lightrag:
    ports:
      - "9621:9621"  # 开发模式对外暴露 LightRAG 端口
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 宿主机调试：lightrag 可访问宿主 Neo4j/llm-gateway

  atomic-rag:
    ports:
      - "8004:8000"  # 开发模式对外暴露 atomic-rag 调试端口，不用于前端调用
    environment:
      # 本模式下 kb 与各能力服务跑在**宿主机**，故必须覆盖 base 的容器内地址。
      # 与 sidecar 的 KNOWLEDGE_BASE_URL 保持同值（两者都是「kb 的 /invoke 基址」）。
      # compiled_schema_client 读的是同一个配置项；不覆盖会连到不存在的
      # knowledge-base-service 容器 → 静默回落 default.yaml。
      KNOWLEDGE_BASE_URL: http://host.docker.internal:8003
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 宿主机调试：atomic-rag 可访问宿主服务
      - "lightrag:host-gateway"               # 宿主机调试 LightRAG 时，解析 lightrag → 宿主机

  knowledge-base-service:
    ports:
      - "8003:8000"  # 开发模式对外暴露知识库服务端口
    # 注：原 CONTAINER_REST_ENABLED 调试层开关已随该层实现一并删除
    # （2026-10 渗透测试整改）。直连容器调试请用 `/invoke` + 内部服务 JWT，
    # 或走 Gateway 前缀 `/api/v1/knowledge-base/**`。

  business-domain-service:
    ports:
      - "8005:8000"  # 开发模式对外暴露业务领域服务端口
    # 注：同上，容器 REST 调试层已删除。走 `/invoke` 或 Gateway
    # 前缀 `/api/v1/ecosystem/**`。

  data-governance-service:
    ports:
      - "8011:8000"  # 开发模式对外暴露数据治理服务端口

  task-center-service:
    ports:
      - "8007:8000"  # 开发模式对外暴露任务中心服务端口

  platform-service:
    ports:
      - "8006:8000"  # 开发模式对外暴露平台管理服务端口

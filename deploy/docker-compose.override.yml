# ============================================================
# Docker Compose 开发环境配置
#
# 使用说明：
# - 本地开发：docker-compose up -d 自动加载此文件
# - 生产部署：docker-compose -f docker-compose.yml up -d 显式跳过此文件
#
# 区别：开发模式下 gateway/sidecar 端口对外暴露，方便直连调试
# ============================================================

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"  # 开发模式对外暴露 PG（生产基线已移除）
  redis:
    ports:
      - "127.0.0.1:6379:6379"  # 开发模式对外暴露 Redis（生产基线已移除）
  milvus:
    ports:
      - "127.0.0.1:19530:19530"  # gRPC
      - "127.0.0.1:9091:9091"    # HTTP / metrics
  neo4j:
    ports:
      - "127.0.0.1:7474:7474"    # dev 期 browser 调试
      - "127.0.0.1:7687:7687"    # dev 期 bolt 连接

  minio:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
  gateway:
    ports:
      - "127.0.0.1:8000:8000"  # 开发模式对外暴露 API 端口，方便调试
    # ⚠️ 与 base 里 gateway 的 `ENV: ${ENV:-prod}` **配对使用，不是替代它**：
    #   · base 那一行是**生产兜底** —— `make up-prod` 只用 base，而 gateway 又是唯一
    #     没有 `env_file` 的应用服务；没有它，生产 gateway 会退回字段默认 "dev"，
    #     `jonex_test_<租户>` 后门就在前门重开（渗透报告 RC-E）。**删不得。**
    #   · 这一行是**开发兜底** —— 让开发栈在 .env 意外缺 `ENV=` 时也稳定落到 dev。
    #     否则 base 的 `:-prod` 会把本地 gateway 顶成生产模式，而 sidecar 等经 `env_file`
    #     读不到 ENV 会落到字段默认 dev → **同一套开发栈里 gateway 是 prod、其余是 dev**，
    #     表现为「gateway 拒绝 jonex_test_*、别的服务却允许」的诡异 401。
    # 两行取值都以 .env 为准（`${ENV:-…}`），只是缺省方向相反：生产倒向安全，开发倒向可用。
    environment:
      ENV: ${ENV:-dev}

  sidecar:
    ports:
      - "127.0.0.1:8001:8000"  # 开发模式对外暴露 Sidecar 端口

  llm-gateway:
    ports:
      - "127.0.0.1:8788:8787"  # 开发模式对外暴露 LLM 网关端口（8787 被本机 bun 进程占用，改映射 8788）

  lightrag:
    ports:
      - "127.0.0.1:9621:9621"  # 开发模式对外暴露 LightRAG 端口

  atomic-rag:
    ports:
      - "127.0.0.1:8004:8000"  # 开发模式对外暴露 atomic-rag 调试端口，不用于前端调用

  openkb:
    ports:
      - "127.0.0.1:7566:7566"  # 开发时暴露到宿主机

  knowledge-base-service:
    ports:
      - "127.0.0.1:8003:8000"  # 开发模式对外暴露知识库服务端口

  business-domain-service:
    ports:
      - "127.0.0.1:8005:8000"  # 开发模式对外暴露业务领域服务端口（生产基线已移除该映射）

  data-governance-service:
    ports:
      - "127.0.0.1:8011:8000"  # 开发模式对外暴露数据治理服务端口

  task-center-service:
    ports:
      - "127.0.0.1:8007:8000"  # 开发模式对外暴露任务中心服务端口

  platform-service:
    ports:
      - "127.0.0.1:8006:8000"  # 开发模式对外暴露平台管理服务端口
    environment:
      LOG_LEVEL: DEBUG

  mcp-server:
    ports:
      - "127.0.0.1:8002:8002"  # 开发模式对外暴露 MCP 端口（生产基线已移除，经 443 的 /mcp 进入）

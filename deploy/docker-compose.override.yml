# ============================================================
# Docker Compose 开发环境配置
#
# 使用说明：
# - 本地开发：docker-compose up -d 自动加载此文件
# - 生产部署：docker-compose -f docker-compose.yml up -d 显式跳过此文件
#
# 区别：开发模式下 gateway/sidecar 端口对外暴露，方便直连调试
# ============================================================

services:
  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
  gateway:
    ports:
      - "8000:8000"  # 开发模式对外暴露 API 端口，方便调试

  sidecar:
    ports:
      - "8001:8000"  # 开发模式对外暴露 Sidecar 端口

  lightrag:
    ports:
      - "9621:9621"  # 开发模式对外暴露 LightRAG 端口

  atomic-rag:
    ports:
      - "8004:8000"  # 开发模式对外暴露 atomic-rag 调试端口，不用于前端调用

  openkb:
    ports:
      - "7566:7566"  # 开发时暴露到宿主机

  knowledge-base-service:
    ports:
      - "8003:8000"  # 开发模式对外暴露知识库服务端口

  platform-service:
    ports:
      - "8006:8000"  # 开发模式对外暴露平台管理服务端口
    environment:
      LOG_LEVEL: DEBUG

# ============================================================
# 悦溪平台 Frontend Gateway Nginx 配置
# 唯一对外前端入口，聚合 shell、子应用 standalone、子应用 remote assets、后端 API
# ============================================================

server {
    listen 80;
    server_name localhost;
    charset utf-8;

    # 文件上传大小限制
    client_max_body_size 500m;

    # Docker 内置 DNS，用于延迟解析 upstream 主机名，避免 nginx 启动时解析失败
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json font/ttf font/otf font/woff font/woff2 application/font-woff application/font-woff2;

    # ============================================================
    # 1. 健康检查
    # ============================================================
    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
        access_log off;
    }

    # ============================================================
    # 2. API 反向代理
    # ============================================================
    location ^~ /api/ {
        set $gateway_upstream gateway:8000;
        proxy_pass http://$gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ============================================================
    # 7. core-business remote assets（Module Federation）
    # ============================================================
    location ^~ /remotes/core-business/ {
        set $core_business_upstream core-business-frontend;
        proxy_pass http://$core_business_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # 8. core-business standalone SPA
    # ============================================================
    location ^~ /core-business/ {
        set $core_business_upstream core-business-frontend;
        proxy_pass http://$core_business_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # 9. platform-management remote assets（Module Federation）
    # ============================================================
    location ^~ /remotes/platform-management/ {
        set $platform_management_upstream platform-management-frontend;
        proxy_pass http://$platform_management_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # 10. platform-management standalone SPA
    # ============================================================
    location ^~ /platform-management/ {
        set $platform_management_upstream platform-management-frontend;
        proxy_pass http://$platform_management_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # 13. ecosystem-management remote assets（Module Federation）
    # ============================================================
    location ^~ /remotes/ecosystem-management/ {
        set $ecosystem_management_upstream ecosystem-management-frontend;
        proxy_pass http://$ecosystem_management_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # 14. ecosystem-management standalone SPA
    # ============================================================
    location ^~ /ecosystem-management/ {
        set $ecosystem_management_upstream ecosystem-management-frontend;
        proxy_pass http://$ecosystem_management_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # 15. Shell 应用 — 兜底路由
    # ============================================================
    location / {
        set $shell_upstream shell-frontend;
        proxy_pass http://$shell_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # 安全头
    # ============================================================
    # CSP 由 /docker-entrypoint.d/40-csp.sh 在容器启动时按 CSP_STORAGE_ORIGIN 生成，
    # 以适配 cos / s3 / minio 各自不同的存储域（见 deploy/docker/frontend-gateway-csp.sh）。
    # 原先此处硬编码 *.myqcloud.com，换 S3 后端后 302 直跳的图片/音视频会违反 CSP。
    include /etc/nginx/csp.conf;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    error_page 500 502 503 504 /50x.html;
}

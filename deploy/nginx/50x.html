<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>服务暂时不可用</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f7fa;
        color: #0b2b5c;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
      }
      .card {
        max-width: 420px;
        padding: 40px;
        text-align: center;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 24px rgba(11, 43, 92, 0.08);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 20px;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: #5a6c85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>服务暂时不可用</h1>
      <p>请稍后重试。若持续无法访问，请联系平台管理员。</p>
    </div>
  </body>
</html>

# ============================================================
# 接入模式：https —— 域名 + HTTPS，TLS 在本容器终止
# 适用：AWS 公网部署
#
# 由 /docker-entrypoint.d/05-access-mode.sh 在 ACCESS_MODE=https 时拷成
# /etc/nginx/conf.d/default.conf 启用；该脚本会先校验证书存在，缺失则报错退出。
#
# 前置：证书挂载到 /etc/nginx/certs/{fullchain.crt,private.key}
#      （宿主机路径由 TLS_CERT_DIR 指定，须为仓库外路径）
#
# 不写 listen [::]:80 / [::]:443 —— 理由同 server-http.conf（官方 IPv6 脚本只对
# 未修改过的 default.conf 生效，对本文件不起作用；与既有行为一致）。
# ============================================================

# ---------- 80：跳转 + 健康检查 ----------
server {
    listen 80 default_server;
    server_name _;

    # 容器 healthcheck 打的是 http://127.0.0.1/health，必须直通不跳转，
    # 否则 301 会让 curl -sf 判定失败，容器一直 unhealthy。
    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
        access_log off;
    }

    # 其余一律 301 到 https。$host 自适应，换域名不用改这里。
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：TLS 终止 + 业务路由 ----------
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS 默认不启用。它与「随时切回 http」互斥：浏览器端持久化，一旦下发，
    # 该域名在 max-age 内被强制改写为 https，切回 http 后客户端直接打不开且
    # 服务端清不掉（用户需手动进 chrome://net-internals/#hsts 删除）。
    # 确需启用请从极短 max-age 起步，观察稳定后再调大：
    # add_header Strict-Transport-Security "max-age=300" always;

    include /etc/nginx/app-locations.conf;
}

# ============================================================
# 接入模式：http —— IP + HTTP 直接访问，无 TLS、无跳转
# 适用：公司内部部署（无域名、无证书）
#
# 由 /docker-entrypoint.d/05-access-mode.sh 在 ACCESS_MODE=http（默认）时
# 拷成 /etc/nginx/conf.d/default.conf 启用。
#
# 不写 listen [::]:80：容器无 IPv6 时会 bind 失败导致 nginx 起不来。
# 注意官方的 10-listen-on-ipv6-by-default.sh 帮不上忙——它只在 default.conf 的
# checksum 与镜像自带版本一致时才打补丁，我们的配置必然不一致，实测它会输出
# "differs from the packaged version" 然后跳过。改造前的 frontend-gateway.conf
# 同样不匹配，所以 IPv6 监听此前也从未启用，此处与既有行为一致，无回退。
# 若将来确实需要 IPv6，在此显式添加，并确认部署环境的容器网络已启用 IPv6。
# ============================================================

server {
    listen 80 default_server;
    # 单租户网关不按域名分流，_ 接受任意 Host（IP 直连、内网主机名均可）
    server_name _;

    include /etc/nginx/app-locations.conf;
}

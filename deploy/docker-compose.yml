  # ============================================================
  # Neo4j - 本体图数据库（社区版，单 database）
  # 存储：本体 ABox（:OntologyEntity label）+ LightRAG 图谱（workspace label）
  # ============================================================
  neo4j:
    image: neo4j:5.26-community
    container_name: jonex-neo4j
    hostname: neo4j
    networks:
      - jonex-network
    ports:
      - "7474:7474"     # dev 期 browser 调试
      - "7687:7687"     # dev 期 bolt 连接
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-jonex_neo4j_123}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512M}
      TZ: Asia/Shanghai
    volumes:
      - jonex-neo4j-data:/data
      - jonex-neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

# ============================================================
# Jonex 平台 Docker Compose 编排文件
# ============================================================
# 基础设施版本选型（锁定）：
#   PostgreSQL  15-alpine   (LTS → 2027-11)
#   Redis       7-alpine    (⚠️ 4.0 已 EOL，禁止降级)
#   Milvus      2.5.14      (需 BM25 + 混合检索)
#   etcd        3.5.18      (Milvus 硬性要求 ≥3.5.0)
#   MinIO       2025-04-22  (S3 v4 签名兼容)
# ============================================================
# 【宿主端口策略】2026-10 渗透测试 RC-B 修复
# ------------------------------------------------------------
# **本文件在生产被加载**（`make up-prod` / `up-server` 只用它），
# 因此这里**只保留真正的对外入口**：`frontend-gateway` 的 80/443。
#
# 其余服务的 `ports:` 一律不在这里发布 —— 容器之间经 `jonex-network`
# 用服务名（`postgres` / `redis` / `knowledge-base-service` …）互访，
# 与 `ports:` 无关，删掉不影响任何内部调用（已核对 `deploy/.env`：
# `DB_HOST=postgres`、`REDIS_URL=redis://redis:6379/0`、`MILVUS_HOST=milvus` …）。
#
# 本地调试需要的端口映射在 `docker-compose.override.yml`（仅 `make up` 加载），
# 因此「生产不发布 / 开发照旧」两边同时成立。
#
# 例外与保留：
#   - `frontend-gateway` 80/443：唯一对外的**用户入口**，保留。
#   - `identity-sync-gateway` `127.0.0.1:8099`：已绑回环，是正确范式，保留。
# ============================================================

networks:
  jonex-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  jonex-postgres-data:
    driver: local
  jonex-redis-data:
    driver: local
  jonex-etcd-data:
    driver: local
  jonex-minio-data:
    driver: local
  jonex-milvus-data:
    driver: local
  jonex-rag-storage:
    driver: local
  jonex-rag-inputs:
    driver: local
  jonex-rag-models:
    driver: local
  jonex-openkb-storage:
    driver: local
  jonex-wiki-storage:
    driver: local
  jonex-logs:
    driver: local
  jonex-neo4j-data:
    driver: local
  jonex-neo4j-logs:
    driver: local

services:
  # ============================================================
  # 基础设施 - PostgreSQL 数据库
  # ============================================================
  postgres:
    # 勿改回 alpine 版：musl 编译的 postgres 在 CentOS 7（内核 3.10）写 pg_wal 失败，initdb 无法完成
    image: postgres:15
    container_name: jonex-postgres
    hostname: postgres
    networks:
      - jonex-network
    # 不发布宿主端口（生产）：本地调试映射见 docker-compose.override.yml
    environment:
      POSTGRES_USER: ${DB_USERNAME:-jonex}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: ${DB_NAME:-jonex}
      TZ: Asia/Shanghai
    volumes:
      - jonex-postgres-data:/var/lib/postgresql/data
      - ./postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jonex} -d ${DB_NAME:-jonex}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # 基础设施 - Redis 缓存 / 服务发现
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: jonex-redis
    hostname: redis
    networks:
      - jonex-network
    # 不发布宿主端口（生产）：本地调试映射见 docker-compose.override.yml
    environment:
      TZ: Asia/Shanghai
      # Redis 访问口令。留空 ⇒ 不启用认证（保持既有 dev 行为）。
      # 生产请在各 profile env 文件里设置 REDIS_PASSWORD，并同步把 REDIS_URL 写成
      #   redis://:<REDIS_PASSWORD>@redis:6379/0
      # 否则应用连不上（认证失败）。
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - jonex-redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    # 仅当 REDIS_PASSWORD 非空时才加 --requirepass，避免空口令把认证搞成半残状态。
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      # 有口令时必须带 -a，否则 redis-cli ping 返回 NOAUTH、容器永远不健康。
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+--no-auth-warning -a $REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # 基础设施 - etcd（Milvus 元数据存储）
  # ============================================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: jonex-etcd
    hostname: etcd
    networks:
      - jonex-network
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
      TZ: Asia/Shanghai
    volumes:
      - jonex-etcd-data:/etcd
    command: >
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
      --initial-advertise-peer-urls=http://etcd:2380
      --listen-peer-urls=http://0.0.0.0:2380
      --initial-cluster=default=http://etcd:2380
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ============================================================
  # 基础设施 - MinIO（Milvus 对象存储）
  # ============================================================
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: jonex-minio
    hostname: minio
    networks:
      - jonex-network
    environment:
      # ⚠️ 生产必须覆盖（`deploy/env/<profile>/.env.<profile>` 里设 MINIO_ROOT_USER /
      #    MINIO_ROOT_PASSWORD）。默认 minioadmin 仅为兼容既有 dev 与未轮换的 profile；
      #    这是**已登记的已知风险**（bd jonex-platform-yot）。
      #    milvus 服务的 MinIO 凭据取自同一组变量（但变量名不同，见 milvus 服务的注释），
      #    改一处即两者一致。
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: Asia/Shanghai
    volumes:
      - jonex-minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ============================================================
  # 基础设施 - Milvus 向量数据库
  # ============================================================
  milvus:
    image: milvusdb/milvus:v2.5.14
    container_name: jonex-milvus
    hostname: milvus
    networks:
      - jonex-network
    # 不发布宿主端口（生产）：本地调试映射见 docker-compose.override.yml
    environment:
      TZ: Asia/Shanghai
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # ⚠️ 变量名必须用 Milvus 2.5.x 的名字：MILVUS 只认 MINIO_ACCESS_KEY_ID /
      #    MINIO_SECRET_ACCESS_KEY（见镜像内 /milvus/configs/milvus.yaml 的注释），
      #    旧名 MINIO_ACCESS_KEY / MINIO_SECRET_KEY 被**静默忽略**、回落到内置默认
      #    minioadmin/minioadmin。dev 里 MinIO 恰好也是 minioadmin 所以一直蒙对；
      #    一旦按 RC-F 轮换 MINIO_ROOT_USER/PASSWORD，Milvus 就会
      #    "The Access Key Id you provided does not exist in our records." 并因
      #    healthz 持续 Unhealthy 而拖垮 up（实测 2026-10-15）。
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - jonex-milvus-data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  # ============================================================
  # 知识库能力服务
  # ============================================================
  knowledge-base-service:
    build:
      context: ..
      dockerfile: deploy/docker/capability.Dockerfile
      args:
        CAPABILITY_NAME: knowledge_base
        PYTHON_BASE: python-base                            # 共享基础镜像
      additional_contexts:
        python-base: "docker-image://jonex/python-base:local"
    container_name: jonex-knowledge-base
    hostname: knowledge-base
    networks:
      - jonex-network
    # 不发布宿主端口（生产）：本地调试映射见 docker-compose.override.yml
    environment:
      TZ: Asia/Shanghai
      CAPABILITY_NAME: knowledge_base
      SERVICE_ENDPOINT: http://knowledge-base-service:8000
      LOG_LEVEL: INFO
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-jonex}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-jonex}
      REDIS_URL: redis://redis:6379/0
      # RAG 调用通过 Sidecar 反代到 atomic-rag
      SIDECAR_URL: http://sidecar:8000
      # 内部 X-API-Key：须与 sidecar/gateway 镜像内 GATEWAY_API_KEY 默认值一致。
      # 旧镜像默认 jonex_test_gateway，新代码默认哨兵 change-me-in-production（config.py），
      # 显式注入避免重建后漂移导致 RAG 调 Sidecar /invoke 401。
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-jonex_test_gateway}
      # 审计日志转发到 platform（非 platform 容器必须设置，否则审计静默丢弃）
      AUDIT_INGEST_URL: http://platform-service:8000
      CAPABILITY_RUNTIME_FILE: /app/config/capability_runtime.yaml
      # Neo4j 本体图数据库连接
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me}
      NEO4J_ONTOLOGY_LABEL: OntologyEntity
      # [jonex] P5-var 退化闸门：reconcile 重写前对比本文档图中已有实体数，
      # 跌幅超阈值（0.3 = 30%）告警并拒绝覆盖（方差下沿不吞旧数据；0 关闭）
      ONTOLOGY_RECONCILE_DEGRADE_GUARD_THRESHOLD: ${ONTOLOGY_RECONCILE_DEGRADE_GUARD_THRESHOLD:-0.3}
      # Ontology LLM (分流问答)
      ONTOLOGY_LLM_BINDING_HOST: ${ONTOLOGY_LLM_BINDING_HOST:-http://llm-gateway:8787/v1}
      ONTOLOGY_LLM_BINDING_API_KEY: ${ONTOLOGY_LLM_BINDING_API_KEY:-${LLM_BINDING_API_KEY:-}}
      ONTOLOGY_LLM_MODEL: ${ONTOLOGY_LLM_MODEL:-deepseek/deepseek-flash}
      # RAG 降级路径（平台取回答作权）自 2026-09-22 起为唯一路径，原灰度开关已删除
      RAG_ANSWER_MAX_CONTEXT_CHARS: ${RAG_ANSWER_MAX_CONTEXT_CHARS:-12000}
      # [jonex] 方案 B：主体一致性软加权（λ，仅 RAG_SUBJECT_FILTER_ENABLED=true 时生效）
      RAG_SUBJECT_WEIGHT: ${RAG_SUBJECT_WEIGHT:-0.25}
      # [jonex] §block-packing §10 L2：跨页打包 chunk 引用页精算（页段打分，默认开）
      RAG_REF_PAGE_SCORING_ENABLED: ${RAG_REF_PAGE_SCORING_ENABLED:-true}
      RERANK_BINDING_HOST: ${RERANK_BINDING_HOST:-http://llm-gateway:8787/v1}
      RERANK_BINDING_API_KEY: ${RERANK_BINDING_API_KEY:-${LLM_BINDING_API_KEY:-}}
      # [jonex] 默认值改为现网 vLLM 的 served-model-name。旧默认 `awenleven/Qwen3-Reranker-4B:Q4_K_M`
      # 是已下线的 Ollama tag：上游收到不认识的模型名会**回 200 + 空 results**（静默），
      # kb-service 侧只表现成「reranker 返回空结果」→ 统一 rerank 真分覆盖率 0%、整池退化
      # order_decay。A/B 实测（2026-09-23）：旧 tag → {"results":[]}，Qwen3-Reranker-4B → 正常分值。
      RERANK_MODEL: ${RERANK_MODEL:-Qwen3-Reranker-4B}
      # [jonex] S1：本体侧候选 chunk 正文批量回捞。**它是统一 rerank 的前置条件**
      # （关闭时文本/表格候选正文全空 → `_prellm_rerank_chunks` 提前返回 → 全池
      # order_decay，且引用 location 无 text → 前端「命中片段原文」为空）。默认
      # false＝保持改造前行为（只回捞图片）；开启由 .env 显式置 true。
      # 依据见 deploy/.env.example「S1 本体侧 chunk 正文批量回捞」。
      ONTOLOGY_CHUNK_TEXT_PREFETCH_ENABLED: ${ONTOLOGY_CHUNK_TEXT_PREFETCH_ENABLED:-false}
      ONTOLOGY_CHUNK_TEXT_PREFETCH_TIMEOUT: ${ONTOLOGY_CHUNK_TEXT_PREFETCH_TIMEOUT:-10}
      ONTOLOGY_CHUNK_TEXT_PREFETCH_MAX_DOCS: ${ONTOLOGY_CHUNK_TEXT_PREFETCH_MAX_DOCS:-32}
      ONTOLOGY_CHUNK_TEXT_PREFETCH_CONCURRENCY: ${ONTOLOGY_CHUNK_TEXT_PREFETCH_CONCURRENCY:-4}
      # 对象存储（local / 腾讯云 COS / S3 兼容），默认 local
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-local}
      COS_REGION: ${COS_REGION:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_KEY_PREFIX: ${COS_KEY_PREFIX:-jonex}
      COS_PRESIGN_EXPIRES: ${COS_PRESIGN_EXPIRES:-900}
      # [jonex] S3 兼容：本服务 head_object/head_object_size（确认对象存在、读大小做配额）
      # 与 get_raw_location 生成预签名 URL 都要初始化 S3 客户端，缺变量会 ValueError。
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-auto}
      S3_PRESIGN_EXPIRES: ${S3_PRESIGN_EXPIRES:-900}
      KB_INPUT_DIR: /app/inputs               # 与 gateway/atomic-rag 共享上传文件（local 后端原文查看/读取）
    # [jonex] 以图问知识的 `IMAGE_QUERY_*`（上限 / VLM / 暂存 / 兜底扫描等）**不经这里
    # 逐个透传** —— 下面这行 env_file 已把整份 deploy/.env 注入本容器（见 .env.example §19）。
    # 这与 task-center-service 那句注释同一个口径：两处各写一份，改了一处就会忘另一处。
    # ⚠️ 但 **gateway 没有 env_file**（它只有显式 environment 清单），所以那 5 个
    # 「网关侧要用的」必须在 gateway 段显式列出来 —— 见下面 gateway 服务里的那段。
    env_file:
      - .env
    volumes:
      - jonex-logs:/app/logs
      - jonex-rag-inputs:/app/inputs             # local 后端：读取 gateway/atomic-rag 写入的原始文件
      # [jonex] P0-d：失败/完成任务的 JSON 直读兜底。大文档（实测 ontology_data
      # 82MB）经 Sidecar 转发时会把 uvicorn worker 打崩，HTTP 侧只拿到
      # "Server disconnected without sending a response."，故对账在 HTTP 不可用时
      # 改从同卷磁盘读 task JSON。只读挂载，KB 不写 RAG 的工作目录。
      - jonex-rag-storage:/app/rag_storage:ro
      - ./config/capability_runtime.yaml:/app/config/capability_runtime.yaml:ro
      - ./config/ontology:/app/deploy/config/ontology:ro   # 编译 yaml_default 兜底需要 default.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      llm-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ============================================================
  # 业务领域能力服务（领域空间 + 生态管理 + 引擎管理）
  # ============================================================
  business-domain-service:
    build:
      context: ..
      dockerfile: deploy/docker/capability.Dockerfile
      args:
        CAPABILITY_NAME: business_domain
        PYTHON_BASE: python-base                            # 共享基础镜像
      additional_contexts:
        python-base: "docker-image://jonex/python-base:local"
    container_name: jonex-business-domain
    hostname: business-domain
    networks:
      - jonex-network
    # 不发布宿主端口（生产）：本地调试映射见 docker-compose.override.yml
    environment:
      TZ: Asia/Shanghai
      CAPABILITY_NAME: business_domain
      SERVICE_ENDPOINT: http://business-domain-service:8000
      LOG_LEVEL: INFO
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-jonex}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-jonex}
      REDIS_URL: redis://redis:6379/0
      SIDECAR_URL: http://sidecar:8000
      # 审计日志转发到 platform（非 platform 容器必须设置，否则审计静默丢弃）
      AUDIT_INGEST_URL: http://platform-service:8000
    env_file:
      - .env
    volumes:
      - jonex-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ============================================================
  # 数据治理能力服务（资产目录 + 元数据 + 文档级双向血缘）
  # ============================================================
  data-governance-service:
    build:
      context: ..
      dockerfile: deploy/docker/data-governance.Dockerfile
      args:
        CAPABILITY_NAME: data_governance
        PYTHON_BASE: python-base                            # 共享基础镜像
      additional_contexts:
        python-base: "docker-image://jonex/python-base:local"
    container_name: jonex-data-governance
    hostname: data-governance-service
    networks:
      - jonex-network
    # 不发布宿主端口（生产）：本地调试映射见 docker-compose.override.yml
    environment:
      TZ: Asia/Shanghai
      CAPABILITY_NAME: data_governance
      CAPABILITY_KIND: business
      SERVICE_PORT: 8000
      SERVICE_ENDPOINT: http://data-governance-service:8000
      LOG_LEVEL: INFO
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-jonex}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-jonex}
      REDIS_URL: redis://redis:6379/0
      SIDECAR_URL: http://sidecar:8000
      # 血缘来源经 Sidecar 调 business.knowledge_base.v1，内部 key 必须与 Sidecar 一致
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-jonex_test_gateway}
      # 审计日志转发到 platform（非 platform 容器必须设置，否则审计静默丢弃）
      AUDIT_INGEST_URL: http://platform-service:8000
    env_file:
      - .env
    volumes:
      - jonex-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ============================================================
  # 任务中心能力服务（编排定义 / 版本发版 / 触发 / 任务与子任务调度）
  # ------------------------------------------------------------
  # 它自己不开对外网络接口，只做两件事：
  #   1) 经 Sidecar /invoke 收接入方与运行方的对内函数调用（§4.3）；
  #   2) 后台循环出站派活给运行方（§4.1 ① execute）。
  # ============================================================
  task-center-service:
    build:
      context: ..
      dockerfile: deploy/docker/capability.Dockerfile
      args:
        CAPABILITY_NAME: task_center
        PYTHON_BASE: python-base                            # 共享基础镜像
      additional_contexts:
        python-base: "docker-image://jonex/python-base:local"
    container_name: jonex-task-center
    hostname: task-center
    networks:
      - jonex-network
    # 不发布宿主端口（生产）：本地调试映射见 docker-compose.override.yml
    environment:
      TZ: Asia/Shanghai
      CAPABILITY_NAME: task_center
      SERVICE_ENDPOINT: http://task-center-service:8000
      LOG_LEVEL: INFO
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-jonex}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-jonex}
      REDIS_URL: redis://redis:6379/0
      # 派活给运行方（知识库）经 Sidecar 反代
      SIDECAR_URL: http://sidecar:8000
      # 任务派发使用与 Sidecar/知识库一致的内部认证配置。
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-jonex_test_gateway}
      # 审计日志转发到 platform（非 platform 容器必须设置，否则审计静默丢弃）
      AUDIT_INGEST_URL: http://platform-service:8000
      # 派活目标（business.knowledge_base.v1）的落地方式在这份清单里；
      # 清单里没声明的能力一律回退 local，运行方就会「找不到」。
      CAPABILITY_RUNTIME_FILE: /app/config/capability_runtime.yaml
      # 任务中心自己的配置（后台循环节奏、任务锁、派活超时…）**统一走 .env**，
      # 见 `deploy/.env.example` 第 20 节。这里不再逐个透传 —— 免得两处各写一份、
      # 改了一处忘了另一处。`config.py` 的 `TaskCenterSettings` 有同样的默认值兜底。
      # （后台循环本身**恒开、没有开关**：多副本下不选主，每份都跑。）
    env_file:
      - .env
    volumes:
      - jonex-logs:/app/logs
      - ./config/capability_runtime.yaml:/app/config/capability_runtime.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ============================================================
  # 平台管理能力服务（用户认证、RBAC、菜单、系统配置等）
  # ============================================================
  platform-service:
    build:
      context: ..
      dockerfile: deploy/docker/capability.Dockerfile
      args:
        CAPABILITY_NAME: platform
        PYTHON_BASE: python-base                            # 共享基础镜像
      additional_contexts:
        python-base: "docker-image://jonex/python-base:local"
    container_name: jonex-platform
    hostname: platform
    networks:
      - jonex-network
    # 不发布宿主端口（生产）：platform 的 `/api/v1/*` 是生产链路，但走 443 →
    # frontend-gateway → gateway → sidecar → platform，容器间用服务名互访，
    # 无需宿主端口。本地调试映射见 docker-compose.override.yml。
    environment:
      TZ: Asia/Shanghai
      CAPABILITY_NAME: platform
      SERVICE_ENDPOINT: http://platform-service:8000
      LOG_LEVEL: INFO
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-jonex}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-jonex}
      REDIS_URL: redis://redis:6379/0
      SIDECAR_URL: http://sidecar:8000
      AUDIT_INGEST_URL: ""   # platform 自身走本地直写，不走 HTTP 转发
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 独立 keycloak 在宿主 8081：platform 容器内经此访问（SSO token/JWKS）
    volumes:
      - jonex-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ============================================================
  # Sidecar 代理服务（内部能力调用入口）
  # ============================================================
  sidecar:
    build:
      context: ..
      dockerfile: deploy/docker/sidecar.Dockerfile
      args:
        PYTHON_BASE: python-base                            # 共享基础镜像
      additional_contexts:
        python-base: "docker-image://jonex/python-base:local"
    container_name: jonex-sidecar
    hostname: sidecar
    networks:
      - jonex-network
    expose:
      - "8000"
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: INFO
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-jonex}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-jonex}
      REDIS_URL: redis://redis:6379/0
      KNOWLEDGE_BASE_URL: http://knowledge-base-service:8000
      BUSINESS_DOMAIN_URL: http://business-domain-service:8000
      DATA_GOVERNANCE_URL: http://data-governance-service:8000
      TASK_CENTER_URL: http://task-center-service:8000
      ATOMIC_RAG_URL: http://atomic-rag:8000
      PLATFORM_URL: http://platform-service:8000
      OPENKB_URL: http://openkb:7566
      JONEX_WIKI_URL: http://jonex-wiki:8007
      ONTOLOGY_COMPILE_URL: http://ontology-compile:8009
      # 内部 X-API-Key：Sidecar 是校验方，必须与调用方一致——
      # gateway（Gateway→Sidecar）与 knowledge-base（RAG/openkb/jonex_wiki client→Sidecar）
      # 都发这个 key；与下方 gateway 服务、knowledge_base 服务注入同一值。
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-jonex_test_gateway}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      LOGIN_TICKET_EXPIRE_SECONDS: ${LOGIN_TICKET_EXPIRE_SECONDS:-60}
      AUTH_ALLOWED_REDIRECT_URIS: ${AUTH_ALLOWED_REDIRECT_URIS:-{}}
      # Sidecar → 能力服务 invoke 超时（秒）；OpenKB agent 慢查询可超 120s
      SIDECAR_PROXY_TIMEOUT: ${SIDECAR_PROXY_TIMEOUT:-300}
      WORKERS: 4
    env_file:
      - .env
    volumes:
      - jonex-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      platform-service:
        condition: service_healthy
      knowledge-base-service:
        condition: service_healthy
      business-domain-service:
        condition: service_healthy
      task-center-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ============================================================
  # API Gateway（前端统一入口）
  # ============================================================
  gateway:
    build:
      context: ..
      dockerfile: deploy/docker/gateway.Dockerfile
      args:
        PYTHON_BASE: python-base                            # 共享基础镜像
      additional_contexts:
        python-base: "docker-image://jonex/python-base:local"
    container_name: jonex-gateway
    hostname: gateway
    networks:
      - jonex-network
    # Gateway 仅容器间通信，不对外暴露 —— MCP 下载走 COS 直链，前端经 Nginx 反代
    expose:
      - "8000"
    # ⚠️ gateway 是本文件里**唯一只有显式清单、没有 env_file** 的应用服务。
    # 因此 `ENV` 必须在这里显式给出：否则 config.ENV 落到字段默认值 "dev"，
    # **生产也会进开发模式**，使 api_gateway/main.py 的
    # `X-API-Key: jonex_test_<租户>` 兜底在**前门**放行（渗透报告 RC-E）。
    # 取值与其余服务**同源**（都来自部署的 .env：开发 dev / 生产 prod），缺省倒向 prod。
    # ⚠️ **不要**为此给 gateway 加 `env_file: .env`：那会把整份 .env 注入这个前门容器
    # （变量数 35→305，含 MinIO root / Redis / Keycloak realm admin / 上游 LLM key 等
    #  29 个它并不读取的凭据），是最小权限上的净损失。
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: INFO
      ENV: ${ENV:-prod}                       # 运行模式（dev/prod），必须由本行显式给出
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-jonex}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-jonex}
      REDIS_URL: redis://redis:6379/0
      SIDECAR_URL: http://sidecar:8000
      # 内部 X-API-Key：Gateway→Sidecar 认证，须与 sidecar 服务注入值一致
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-jonex_test_gateway}
      # 网关 → Sidecar 代理超时（秒）；需 ≥ Sidecar 的 SIDECAR_PROXY_TIMEOUT
      GATEWAY_SIDECAR_TIMEOUT: ${GATEWAY_SIDECAR_TIMEOUT:-300}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      KB_INPUT_DIR: /app/inputs               # 与 atomic-rag 容器共享路径
      AUTH_CORS_ORIGINS: ${AUTH_CORS_ORIGINS:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # 对象存储（local / 腾讯云 COS / S3 兼容），仅网关上传用，默认 local
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-local}
      COS_KEY_PREFIX: ${COS_KEY_PREFIX:-jonex}
      COS_REGION: ${COS_REGION:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-auto}
      S3_PRESIGN_EXPIRES: ${S3_PRESIGN_EXPIRES:-900}
      # 网关对外公开地址（用于构造文档下载等公开 URL），生产环境需覆盖为实际 IP/域名
      GATEWAY_PUBLIC_BASE_URL: ${GATEWAY_PUBLIC_BASE_URL:-http://localhost:8000}
      # ── [jonex] 以图问知识（图片转查询）──────────────────────────
      # 网关**只需要**这五个：三个上限用于在网关侧先挡一道（能力侧会按同一份配置再核），
      # 超时是识别 action 的单路由预算，票据 TTL 用于给历史条目补签 view_url。
      # ⚠️ 识别本身不在这里发生 —— 网关只读字节、编码、转发（不落盘，见 B6）。
      # ⚠️ 这三个上限**必须与 knowledge-base-service 段取同值**：两处不一致正是
      #    「前端按 4 张判、后端按别的数拒」的来源。
      IMAGE_QUERY_MAX_IMAGES: ${IMAGE_QUERY_MAX_IMAGES:-4}
      IMAGE_QUERY_MAX_BYTES: ${IMAGE_QUERY_MAX_BYTES:-5242880}
      IMAGE_QUERY_MAX_TOTAL_BYTES: ${IMAGE_QUERY_MAX_TOTAL_BYTES:-12582912}
      # ⚠️ 必须 ≤ 本服务的 GATEWAY_SIDECAR_TIMEOUT，且本地联调要 < dev-gateway 的 60s
      IMAGE_QUERY_GATEWAY_TIMEOUT: ${IMAGE_QUERY_GATEWAY_TIMEOUT:-55}
      IMAGE_QUERY_VIEW_TOKEN_TTL: ${IMAGE_QUERY_VIEW_TOKEN_TTL:-900}
    volumes:
      - jonex-logs:/app/logs
      - jonex-rag-inputs:/app/inputs             # 与 atomic-rag 共享上传文件（named volume）
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sidecar:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ============================================================
  # LLM 网关 - OpenAI 兼容代理 + Token 计量
  # 所有 LLM/Embedding 出口（含 LightRAG 内部调用）经此网关
  # ============================================================
  llm-gateway:
    build:
      context: ..
      dockerfile: deploy/docker/llm-gateway.Dockerfile
      args:
        PYTHON_BASE: python-base                            # 共享基础镜像
      additional_contexts:
        python-base: "docker-image://jonex/python-base:local"
    container_name: jonex-llm-gateway
    hostname: llm-gateway
    networks:
      - jonex-network
    expose:
      - "8787"
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: INFO
      REDIS_URL: redis://redis:6379/0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-jonex}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-jonex}
      LLMGW_UPSTREAM_LLM_HOST: ${LLMGW_UPSTREAM_LLM_HOST:-https://tokenhub.tencentmaas.com/v1}
      LLMGW_UPSTREAM_LLM_API_KEY: ${LLMGW_UPSTREAM_LLM_API_KEY:-}
      LLMGW_UPSTREAM_EMBED_HOST: ${LLMGW_UPSTREAM_EMBED_HOST:-http://host.docker.internal:11434/v1}
      LLMGW_UPSTREAM_EMBED_API_KEY: ${LLMGW_UPSTREAM_EMBED_API_KEY:-ollama}
      # Rerank 上游（方案 B2：RAG fallback 引用重排）
      LLMGW_RERANK_BINDING: ${LLMGW_RERANK_BINDING:-ollama-generate}
      LLMGW_RERANK_MODEL: ${LLMGW_RERANK_MODEL:-awenleven/Qwen3-Reranker-4B:Q4_K_M}
      LLMGW_UPSTREAM_RERANK_HOST: ${LLMGW_UPSTREAM_RERANK_HOST:-http://host.docker.internal:11434}
      LLMGW_UPSTREAM_RERANK_API_KEY: ${LLMGW_UPSTREAM_RERANK_API_KEY:-ollama}
      LLMGW_RERANK_PROMPT_PROFILE: ${LLMGW_RERANK_PROMPT_PROFILE:-qwen3}
      LLMGW_RERANK_MAX_DOCS: ${LLMGW_RERANK_MAX_DOCS:-12}
      LLMGW_RERANK_CONCURRENCY: ${LLMGW_RERANK_CONCURRENCY:-4}
      LLMGW_RERANK_TIMEOUT: ${LLMGW_RERANK_TIMEOUT:-30}
      LLMGW_INTERNAL_TOKENS: ${LLMGW_INTERNAL_TOKENS:-${LLM_BINDING_API_KEY:-}}
      LLMGW_METERING_ENABLED: ${LLMGW_METERING_ENABLED:-true}
      LLMGW_PG_FLUSH_MAX_ROWS: ${LLMGW_PG_FLUSH_MAX_ROWS:-20}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"     # Linux 上访问宿主 Ollama 用
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ============================================================
  # Frontend Gateway — 唯一对外 80 端口入口，聚合路由
  # ============================================================
  frontend-gateway:
    build:
      context: ..
      dockerfile: deploy/docker/frontend-gateway.Dockerfile
    container_name: jonex-frontend-gateway
    hostname: frontend-gateway
    environment:
      # [jonex] 对外接入形态：http = IP + HTTP（内部部署）/ https = 域名 + TLS 终止。
      # 启动时由 /docker-entrypoint.d/05-access-mode.sh 二选一生成 default.conf。
      # 切换只改这个变量 + make up（不能 restart，environment 是容器创建时固化的）。
      ACCESS_MODE: ${ACCESS_MODE:-http}
      # [jonex] CSP 中 img-src / media-src 允许的对象存储来源（302 直跳预览用）。
      # 不设则按 OBJECT_STORAGE_BACKEND 取默认：cos 自动用 *.myqcloud.com，
      # s3 无法推导会启动告警，local 留空。填法见 .env.example 第 14 节。
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-local}
      CSP_STORAGE_ORIGIN: ${CSP_STORAGE_ORIGIN:-}
    networks:
      - jonex-network
    ports:
      - "${FRONTEND_PORT:-80}:80"
      # 443 在 http 模式下也映射：容器内没有 443 server，端口空转无副作用。
      # 这样切模式只改 ACCESS_MODE，不用同时动 ports，少一个出错点。
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      # TLS 证书只读挂载。默认指向项目内 deploy/certs（Mac/Windows 本地联调
      # Docker Desktop 不共享 /opt）；服务器部署在 deploy/.env 设
      # TLS_CERT_DIR=/opt/jonex/certs 覆盖即可。安全：证书文件已被
      # deploy/.gitignore 排除（仅 .gitkeep 入库），勿将私钥纳入版本控制。
      # http 模式下挂载空目录无副作用（无 443 server 去读）；
      # https 模式下证书缺失由 05-access-mode.sh 报错退出，失败点明确。
      - "${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro"
    depends_on:
      shell-frontend:
        condition: service_started
      core-business-frontend:
        condition: service_started
      platform-management-frontend:
        condition: service_started
      ecosystem-management-frontend:
        condition: service_started
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ============================================================
  # Shell Frontend — 平台主应用（仅内部暴露）
  # ============================================================
  shell-frontend:
    build:
      context: ..
      dockerfile: frontends/shell/Dockerfile
      args:
        USE_OVERSEAS_MIRROR: ${USE_OVERSEAS_MIRROR:-false}
    container_name: jonex-shell-frontend
    hostname: shell-frontend
    networks:
      - jonex-network
    expose:
      - "80"
    environment:
      TZ: Asia/Shanghai
      ENV: production
      VITE_ALLOWED_REDIRECT_ORIGINS: ${VITE_ALLOWED_REDIRECT_ORIGINS:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ============================================================
  # Core Business Frontend — 核心业务子应用（仅内部暴露）
  # ============================================================
  core-business-frontend:
    build:
      context: ..
      dockerfile: frontends/core-business/Dockerfile
      args:
        USE_OVERSEAS_MIRROR: ${USE_OVERSEAS_MIRROR:-false}
    container_name: jonex-core-business-frontend
    hostname: core-business-frontend
    networks:
      - jonex-network
    expose:
      - "80"
    environment:
      TZ: Asia/Shanghai
      ENV: production
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ============================================================
  # Platform Management Frontend — 平台管理子应用（仅内部暴露）
  # ============================================================
  platform-management-frontend:
    build:
      context: ..
      dockerfile: frontends/platform-management/Dockerfile
      args:
        USE_OVERSEAS_MIRROR: ${USE_OVERSEAS_MIRROR:-false}
    container_name: jonex-platform-management-frontend
    hostname: platform-management-frontend
    networks:
      - jonex-network
    expose:
      - "80"
    environment:
      TZ: Asia/Shanghai
      ENV: production
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ============================================================
  # Ecosystem Management Frontend — 生态管理子应用（仅内部暴露）
  # ============================================================
  ecosystem-management-frontend:
    build:
      context: ..
      dockerfile: frontends/ecosystem-management/Dockerfile
      args:
        USE_OVERSEAS_MIRROR: ${USE_OVERSEAS_MIRROR:-false}
    container_name: jonex-ecosystem-management-frontend
    hostname: ecosystem-management-frontend
    networks:
      - jonex-network
    expose:
      - "80"
    environment:
      TZ: Asia/Shanghai
      ENV: production
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ============================================================
  # LightRAG - 知识库 RAG 服务（原子能力层）
  # ============================================================
  # 配置文件：.env.rag（70+ 可配置项，与平台主配置分离）
  # 支持存储后端：JSON/Nano/PG/Milvus/Qdrant/Neo4j/Mongo/Redis/Memgraph/OpenSearch
  lightrag:
    build:
      context: ..
      dockerfile: deploy/docker/lightrag-source.Dockerfile
      args:
        USE_OVERSEAS_MIRROR: ${USE_OVERSEAS_MIRROR:-false}
    container_name: jonex-lightrag
    hostname: lightrag
    image: jonex-lightrag-source
    networks:
      - jonex-network
    expose:
      - "9621"                      # 仅容器内，atomic-rag 通过此端口调用
    env_file:
      - .env.rag                    # 仅 lightrag 加载此文件
    volumes:
      - jonex-rag-storage:/app/data/rag_storage   # 与 atomic-rag 共享解析缓存（named volume）
      - jonex-rag-inputs:/app/data/inputs          # 与 gateway/atomic-rag 共享上传文件（named volume）
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux 上访问宿主 Ollama 用
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9621/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      # KV/DocStatus 已升级到 PostgreSQL、向量已升级到 Milvus，须待其就绪再启动
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      llm-gateway:
        condition: service_started

  # ============================================================
  # atomic-rag - RAG 原子能力服务（raganything 解析 + 推送 lightrag-server 索引）
  # ============================================================
  # 容器内运行 start_capability.py（FastAPI），加载 LightRAGAdapter，提供：
  #   POST /invoke         — 统一能力调用入口（sidecar 反代调用）
  #   GET  /query/stream   — NDJSON 流式查询（sidecar 直连代理）
  #   GET  /health         — 健康检查
  # ============================================================
  atomic-rag:
    build:
      context: ..
      dockerfile: deploy/docker/atomic-rag.Dockerfile
      args:
        MINERU_SOURCE: ${MINERU_SOURCE:-modelscope}
        USE_OVERSEAS_MIRROR: ${USE_OVERSEAS_MIRROR:-false}
        # 依赖胖瘦：full（默认，三种 RAG_PARSER 都能真跑）/ slim（仅 online/selfhost，省 ~3.9GB）
        # 打瘦身包：RAG_PROFILE=slim docker compose build atomic-rag
        RAG_PROFILE: ${RAG_PROFILE:-full}
    container_name: jonex-atomic-rag
    hostname: atomic-rag
    networks:
      - jonex-network
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      # ---- 服务端口 ----
      SERVICE_PORT: "8000"
      SERVICE_ENDPOINT: http://atomic-rag:8000   # start_capability.py 服务发现注册用 hostname
      TZ: Asia/Shanghai
      # ---- raganything 解析器配置 ----
      # 本文件为通用基线，不强制 GPU。GPU 加速请叠加 docker-compose.gpu.yml；Mac 开发叠加 docker-compose.mac.yml。
      RAG_PARSER: ${RAG_PARSER:-mineru}            # 解析引擎: mineru / docling / paddleocr
      PARSE_METHOD: ${PARSE_METHOD:-auto}          # 解析方式: auto / ocr / txt
      MINERU_BACKEND: ${MINERU_BACKEND:-}          # GPU 基线默认不强制指定后端，交给 MinerU/环境自行选择
      MINERU_TIMEOUT_SECONDS: ${MINERU_TIMEOUT_SECONDS:-1800}
      RAG_PARSE_RETRY_MAX: ${RAG_PARSE_RETRY_MAX:-3}               # [jonex] #4 v2 parse stage 瞬时错误重试次数（含首次，所有 parser 生效）
      RAG_PARSE_RETRY_BASE_SEC: ${RAG_PARSE_RETRY_BASE_SEC:-2.0}   # [jonex] #4 v2 parse stage 重试指数退避基数（秒）
      OUTPUT_DIR: /app/output                      # 解析产物输出目录
      WORKING_DIR: /app/rag_storage                # raganything 解析器工作/缓存目录
      # LIGHTRAG_STORAGE_DIR 已移除：原供 storage_reader 读本地 vdb_*.json，
      # 现已改由 LightRAGGraphReader 经 lightrag-server HTTP 端点读图数据（不再读本地文件）。
      RAG_WORKER_NUM: ${RAG_WORKER_NUM:-2}         # 并发解析 worker 数，GPU 机器可按资源继续调高
      # [jonex] 文档级并发：TaskManager 同时处理的文档数（后台 worker 协程数）。
      WORKER_COUNT: ${WORKER_COUNT:-4}
      # [jonex] 任务队列容量（总槽位 = WORKER_COUNT + 此值，满则入库请求返回 429）。
      TASK_QUEUE_CAPACITY: ${TASK_QUEUE_CAPACITY:-100}
      # [jonex] 单文档内多模态描述 LLM 并发（scene=raganything_ingest：表格/公式/音频等
      # LLM 快任务），原硬编码 2。实际并发 ≈ WORKER_COUNT × 此值，调高需权衡上游 RPM
      # （如 200 次/分钟）与抽取并发额度。图片（VLM）不在此列，见 MAX_PARALLEL_VLM。
      MAX_PARALLEL_MULTIMODAL: ${MAX_PARALLEL_MULTIMODAL:-4}
      # [jonex] VLM 独立限流（§image-refs 排查衍生）：单文档内图片/视频关键帧并发，
      # 直连远端 VLM（不经 llm-gateway），thinking 模型单次 4~105s，槽位有限。
      # 并发过高会排队超过 VLM 超时（RAG_VLM_TIMEOUT）触发 ReadTimeout 重试风暴。
      MAX_PARALLEL_VLM: ${MAX_PARALLEL_VLM:-2}
      # [jonex] 单次 VLM 调用超时（秒）：驱动默认 120s 对 thinking 模型太紧。
      RAG_VLM_TIMEOUT: ${RAG_VLM_TIMEOUT:-300}
      # [jonex] VLM 思考深度（none/low/medium/high）：默认 none 关闭思考
      # （实测关闭后单图 4~105s→约 3s、token 1.2 万→160，且低量化下思考易带幻觉）。
      RAG_VLM_REASONING_EFFORT: ${RAG_VLM_REASONING_EFFORT:-none}
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-modelscope}  # MinerU 模型下载源开关（含 VLM/hybrid 后端）：modelscope 国内可达免代理；huggingface 需外网/代理。这是真正生效的开关
      # mineru_online 解析密钥：不写入 preset/镜像，统一从 env 读取（preset 若显式配置则优先）
      MINERU_API_TOKEN: ${MINERU_API_TOKEN:-}
      MINERU_API_BASE_URL: ${MINERU_API_BASE_URL:-https://mineru.net}
      MINERU_MODEL_VERSION: ${MINERU_MODEL_VERSION:-vlm}
      # VLM / ASR 连接信息（音视频链路，preset 不写死；优先级 preset override > env > profile）
      VLM_BINDING_HOST: ${VLM_BINDING_HOST:-}
      VLM_BINDING_API_KEY: ${VLM_BINDING_API_KEY:-}
      ASR_BASE_URL: ${ASR_BASE_URL:-}
      ASR_API_KEY: ${ASR_API_KEY:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}        # whisper 模型: tiny / base / small / medium / large
      RAG_TEXT_CHUNK_CHARS: ${RAG_TEXT_CHUNK_CHARS:-12000}
      RAG_REQUIRE_DOC_IDS: ${RAG_REQUIRE_DOC_IDS:-true}
      # [jonex] 表格解析与切块治理（docs/table-parsing-retrieval-governance-plan.md §5/§9.2）
      RAG_TABLE_GRID_V2: ${RAG_TABLE_GRID_V2:-true}              # L1 网格化 + L2 表头推断总开关
      TABLE_HEADER_MAX_LEN: ${TABLE_HEADER_MAX_LEN:-40}          # 表头长文本剔除阈值（字符）
      RAG_TABLE_CHUNK_MAX_CHARS: ${RAG_TABLE_CHUNK_MAX_CHARS:-900}   # 表格专用切块预算（字符，O1）
      RAG_LIGHTRAG_CHUNK_SIZE: ${RAG_LIGHTRAG_CHUNK_SIZE:-1200}  # 表格 chunk 超限断言阈值（token，须与 .env.rag CHUNK_SIZE 一致）
      XLSX_NATIVE_NORMALIZE: ${XLSX_NATIVE_NORMALIZE:-true}      # xlsx 双路合并（L3）：openpyxl 表格主轨 + MinerU 图片轨
      RAG_PROMPT_LANG: ${RAG_PROMPT_LANG:-zh}                    # 解析/摘要 prompt 语言（L4.2）
      # [jonex] §block-packing 文本块级打包（docs/text-block-packing-chunk-governance-plan.md §3）
      RAG_TEXT_BLOCK_PACKING: ${RAG_TEXT_BLOCK_PACKING:-true}    # 总开关（false 完全回退逐块 1:1）
      RAG_TEXT_PACK_CHARS: ${RAG_TEXT_PACK_CHARS:-1260}          # 字符预算主控（= 900 token × 1.4）
      RAG_TEXT_PACK_MAX_TOKENS: ${RAG_TEXT_PACK_MAX_TOKENS:-1200}    # 硬上限断言（token，须与 .env.rag CHUNK_SIZE 一致）
      RAG_TEXT_PACK_HEADING_MAX_LEN: ${RAG_TEXT_PACK_HEADING_MAX_LEN:-40}    # heading-like 判定长度上限（字符）
      RAG_TEXT_PACK_DROP_NOISE: ${RAG_TEXT_PACK_DROP_NOISE:-true}    # 噪声丢弃（C2/C3）；false=零信息损失
      # [jonex] §image-refs 图片资产上传（docs/image-reference-chain-execution-plan.md P1-4）
      RAG_ASSET_UPLOAD_ENABLED: ${RAG_ASSET_UPLOAD_ENABLED:-true}    # 图片资产上传总开关（false 只停资产上传与 aext 旁路，不阻塞主链路）
      # [jonex] §image-refs 图片版面主题锚点（docs/image-reference-accuracy-fix-plan.md E 方案 P0-6）
      RAG_IMAGE_ANCHOR_ENABLED: ${RAG_IMAGE_ANCHOR_ENABLED:-true}   # false 完全回退旧行为（描述无锚点）
      RAG_TRACK_TIMEOUT_SECONDS: ${RAG_TRACK_TIMEOUT_SECONDS:-1800}
      RAG_TRACK_POLL_CONCURRENCY: ${RAG_TRACK_POLL_CONCURRENCY:-8}
      # [jonex] reparse cleanup 收敛循环（rag-reparse-strict-cleanup-busy-plan）
      RAG_PUSH_RETRY_TERMINAL_FAILED: ${RAG_PUSH_RETRY_TERMINAL_FAILED:-true}  # 1-A：终态 failed chunk 纳入有界重推
      RAG_CLEANUP_MAX_ELAPSED: ${RAG_CLEANUP_MAX_ELAPSED:-1800}                # P0：_converge_delete 最长运行时间（秒）
      RAG_CLEANUP_POLL_DELAY: ${RAG_CLEANUP_POLL_DELAY:-5}                     # P0：收敛循环每轮 poll 间隔（秒）
      RAG_CLEANUP_POLL_PER_DOC_SEC: ${RAG_CLEANUP_POLL_PER_DOC_SEC:-2}         # P0：deadline 随删除量缩放 per-doc 秒数
      TORCH_SHOW_CPP_STACKTRACES: ${TORCH_SHOW_CPP_STACKTRACES:-0}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-8}       # GPU 机器默认放宽 CPU 线程；Mac 在覆盖文件中降配
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-8}

      # ---- VLM / Vision 配置（视频关键帧分析 & 多模态图像处理） ----
      VISION_BINDING_HOST: ${VISION_BINDING_HOST:-${LLM_BINDING_HOST:-}}
      VISION_BINDING_API_KEY: ${VISION_BINDING_API_KEY:-${LLM_BINDING_API_KEY:-}}
      LLM_BINDING_HOST: ${LLM_BINDING_HOST:-}
      LLM_BINDING_API_KEY: ${LLM_BINDING_API_KEY:-}

      # ---- LightRAG Server 连接 ----
      LIGHTRAG_API_URL: http://lightrag:9621
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY}
      LIGHTRAG_API_TIMEOUT: "300"                 # LightRAG 入库超时（秒）
      # 容器内地址（与 sidecar 的同名变量一致）：compiled schema 客户端经
      # knowledge-base 的 /invoke 读取（内部服务 JWT 守卫），**不是** 容器 REST 层。
      # ⚠️ 必须用服务名 + 容器端口 8000；不要写宿主映射端口（8003 已不再发布）。
      #    宿主态调试（VSCode 跑 atomic-rag）由 .env.local / config 默认值
      #    http://localhost:8003 承担 —— 宿主上解析不了 Docker 服务名。
      KNOWLEDGE_BASE_URL: http://knowledge-base-service:8000

      # ---- Webhook 回调 ----
      RAG_WEBHOOK_URL: ${RAG_WEBHOOK_URL:-}       # 处理完成后回调地址（空则不回调）

      # ---- 本体抽取引擎 ----
      ONTOLOGY_EXTRACT_ENABLED: ${ONTOLOGY_EXTRACT_ENABLED:-false}
      ONTOLOGY_SCHEMA_PATH: ${ONTOLOGY_SCHEMA_PATH:-/app/deploy/config/ontology/default.yaml}
      ONTOLOGY_EXTRACT_MAX_RETRIES: ${ONTOLOGY_EXTRACT_MAX_RETRIES:-3}
      ONTOLOGY_LLM_BINDING_HOST: ${ONTOLOGY_LLM_BINDING_HOST:-http://llm-gateway:8787/v1}
      ONTOLOGY_LLM_BINDING_API_KEY: ${ONTOLOGY_LLM_BINDING_API_KEY:-${LLM_BINDING_API_KEY:-}}
      ONTOLOGY_LLM_MODEL: ${ONTOLOGY_LLM_MODEL:-deepseek/deepseek-flash}
      ONTOLOGY_LLM_TIMEOUT: ${ONTOLOGY_LLM_TIMEOUT:-60}
      # 独立抽取器单批 LLM 输出 token 上限（P5：4096→8192，§5.4 截断风险）
      ONTOLOGY_EXTRACT_MAX_TOKENS: ${ONTOLOGY_EXTRACT_MAX_TOKENS:-8192}
      # 本体抽取 LLM 批次并发度。经 llm-gateway → 上游 LLM，
      # 与入库期 LightRAG 抽取共用上游并发额度（tokenhub 实测约 48 触发 429）。
      # 默认 8：保守取值、落在无限流区并留余量；上游更严或多文档并行时下调。
      ONTOLOGY_EXTRACT_CONCURRENCY: ${ONTOLOGY_EXTRACT_CONCURRENCY:-8}
      # 实体描述写入 Neo4j 的截断长度（answer_from_facts 的核心上下文；P5：默认 2000 = 独立抽取器现状）
      ONTOLOGY_ENTITY_DESC_MAXLEN: ${ONTOLOGY_ENTITY_DESC_MAXLEN:-2000}
      # ---- [jonex] P1/P2 批策略与补抽（30 vs 107 召回修复）----
      # 每批输入 token 预算上限（估算值，装箱 AND 上限；单 chunk 超预算仍单 chunk 成批）
      ONTOLOGY_EXTRACT_BATCH_BUDGET_TOKENS: ${ONTOLOGY_EXTRACT_BATCH_BUDGET_TOKENS:-24000}
      # 每 chunk 输出 token 预留：每批 chunk 数 = max_tokens // 该值（与 BATCH_SIZE 取小）。
      # 默认 1000 → 8192/1000≈8 chunk/批，缓解大批判注意力稀释的少输出
      ONTOLOGY_EXTRACT_PER_CHUNK_OUTPUT_RESERVE: ${ONTOLOGY_EXTRACT_PER_CHUNK_OUTPUT_RESERVE:-1000}
      # gleaning 补抽轮数：每批回传已抽实体名只输出遗漏。
      # [jonex] P5-var：默认 2（原 1）——上游 temperature=0 非位精确，
      # 多轮 gleaning 只收遗漏，是收敛采样方差的第一个抓手（0 关闭）
      ONTOLOGY_EXTRACT_GLEANING: ${ONTOLOGY_EXTRACT_GLEANING:-2}
      # [jonex] P5-var：主批独立采样次数（self-consistency 并集）。
      # 同输入单次实测实体数波动 25~39；跑 N 次按 canonical_name 取并集
      # 收敛方差（默认 2，成本 ≈N 倍；1 关闭）
      ONTOLOGY_NATIVE_SAMPLE_RUNS: ${ONTOLOGY_NATIVE_SAMPLE_RUNS:-2}
      # ---- procedural 抽取子管线（P7 M2：Skill/Action 规程抽取）----
      # 总闸默认关 = 行为与改造前一致；与「schema 含 Action」每文档条件 AND 生效
      ONTOLOGY_PROCEDURAL_EXTRACT_ENABLED: ${ONTOLOGY_PROCEDURAL_EXTRACT_ENABLED:-false}
      ONTOLOGY_PROCEDURAL_CHUNK_MAX: ${ONTOLOGY_PROCEDURAL_CHUNK_MAX:-30}
      ONTOLOGY_PROCEDURAL_MAX_ACTIONS: ${ONTOLOGY_PROCEDURAL_MAX_ACTIONS:-100}
      ONTOLOGY_PROCEDURAL_NAME_MAXLEN: ${ONTOLOGY_PROCEDURAL_NAME_MAXLEN:-30}
      # 对象存储（local / 腾讯云 COS / S3 兼容），默认 local
      OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-local}
      COS_REGION: ${COS_REGION:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_KEY_PREFIX: ${COS_KEY_PREFIX:-jonex}
      COS_PRESIGN_EXPIRES: ${COS_PRESIGN_EXPIRES:-900}
      # [jonex] S3 兼容：task_manager._fetch_cos_object 在 pipeline 前需下载 s3 对象到本地，
      # 走 get_object_storage_for("s3").get_to_path()，缺变量会 ValueError 导致解析失败。
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-auto}
      S3_PRESIGN_EXPIRES: ${S3_PRESIGN_EXPIRES:-900}
      KB_INPUT_DIR: /app/inputs               # local 后端资产写入目录（与 jonex-rag-inputs 卷一致）
      # MPS（腾讯云媒体处理）视频智能分析：MPS_ENABLED=true 且视频存储在 COS 时，
      # 视频解析走 MPS（取代 ffmpeg+whisper ASR）。
      # 凭证/桶/地域未单独配置时，atomic-rag 内部回落复用 COS_*（同账号同桶场景只需开 MPS_ENABLED）。
      MPS_ENABLED: ${MPS_ENABLED:-false}
      MPS_SECRET_ID: ${MPS_SECRET_ID:-}
      MPS_SECRET_KEY: ${MPS_SECRET_KEY:-}
      MPS_COS_BUCKET: ${MPS_COS_BUCKET:-}
      MPS_COS_REGION: ${MPS_COS_REGION:-}

    volumes:
      - jonex-rag-storage:/app/rag_storage         # raganything 解析器 WORKING_DIR 工作/缓存目录（持久化）；不再用于读 lightrag 存储
      - jonex-rag-inputs:/app/inputs                # 原始材料输入目录
      - jonex-rag-models:/root/.cache              # 模型缓存：HF + modelscope + whisper + torch
      - ./config/ontology:/app/deploy/config/ontology:ro   # 本体 schema 定义
    depends_on:
      lightrag:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s          # 5 分钟：mineru 首次启动需下载模型，pymupdf 可缩短到 120s
    restart: unless-stopped
    # [jonex] P0-1：内存上限（2026-09-13 宿主 OOM 事故后的护栏）。
    # 本服务原先无任何内存限制（mem_limit=0），抽取产出能把宿主内存吃到
    # 23.7GB，内核 oom-killer 挑谁杀是随机的——实测那次挑中 python
    # （anon-rss 23702540kB），触发者是 healthcheck 的 curl 在申请内存时踩响。
    # 加上限后超限变为 cgroup OOM（OOMKilled=true，只死本容器），不再波及同宿主机
    # 的其它服务。取值需高于正常文档峰值：线上 5961 实体文档 VmPeak ≈2.3GB；
    # 本项只管「崩溃边界」，异常大文档由 ONTOLOGY_SOURCE_CHUNKS_MAX 等配额在源头拦。
    mem_limit: ${ATOMIC_RAG_MEM_LIMIT:-12g}
    # 与 mem_limit 相等 = 禁用 swap：避免 OOM 前长时间 swap 抖动把宿主一起拖垮。
    memswap_limit: ${ATOMIC_RAG_MEM_LIMIT:-12g}
    # GPU 用户请叠加 docker-compose.gpu.yml 启用 NVIDIA GPU 加速。
    # Mac 本地开发请叠加 docker-compose.mac.yml 降低资源占用。

  # ============================================================
  # mineru-api - MinerU 文档解析服务（可选，profiles 隔离）
  # 为 RAG_PARSER=mineru_selfhost 提供外部解析端点（POST /tasks +
  # GET /health，与官方 MinerU 的 mineru-api 服务同契约）。
  # 默认不随 make up 起；镜像构建与完整接线步骤见
  # deploy/README.md「文档解析服务 MinerU（可选）」：
  #   docker compose --profile mineru up -d mineru-api
  #   （GPU 再叠 -f docker-compose.gpu.yml；启用后须把 .env 的
  #     MINERU_SELFHOST_BASE_URL 指向 http://mineru-api:8000，并重建 atomic-rag）
  # ============================================================
  mineru-api:
    # 官方不发布预构建镜像，需按官方 Dockerfile 自建（见 README），或 docker load 复用别处镜像
    image: ${MINERU_IMAGE:-mineru:latest}
    container_name: jonex-mineru-api
    hostname: mineru-api
    profiles: ["mineru"]
    networks:
      - jonex-network
    expose:
      - "8000"                    # 仅容器网络内；atomic-rag 按服务名寻址
    # ports:
    #   - "127.0.0.1:8000:8000"   # 仅本机 curl 调试用（注意宿主机 8000 端口占用）
    environment:
      TZ: Asia/Shanghai
      # 官方镜像构建时已固化模型（china 版来自 ModelScope），local=只读内置模型；
      # 换用未内置模型的镜像时改为 modelscope（首次启动现场下载）
      MINERU_MODEL_SOURCE: local
    # 官方镜像 ENTRYPOINT 不带 CMD，须显式给服务命令（同官方 compose 用法）
    entrypoint: mineru-api
    command: ["--host", "0.0.0.0", "--port", "8000"]
    # command 末尾追加 "--allow-public-http-client" 可允许提交公网 URL 文档（有 SSRF 风险，默认关闭）
    ipc: host                     # 官方推荐：共享内存供模型推理
    ulimits:
      memlock: -1
      stack: 67108864
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s          # 首次启动加载模型可能较慢
    restart: unless-stopped

  # ============================================================
  # openkb - 知识库 Wiki 编译服务
  # ============================================================
  # 容器内运行 deploy/start_capability.py（Jonex Atomic Capability），提供：
  #   POST /invoke             — Sidecar 能力调用入口
  #   GET  /health             — 健康检查
  # ============================================================
  openkb:
    build:
      context: ..
      dockerfile: deploy/docker/openkb-source.Dockerfile
      args:
        USE_OVERSEAS_MIRROR: ${USE_OVERSEAS_MIRROR:-false}
    container_name: jonex-openkb
    hostname: openkb
    image: jonex-openkb-source
    networks:
      - jonex-network
    expose:
      - "7566"                      # 仅容器内，adapter 通过此端口调用
    env_file:
      - .env.openkb                 # OpenKB 专属环境变量
    volumes:
      - jonex-openkb-storage:/app/data/kb_storage   # KB Wiki 持久化
      - jonex-rag-inputs:/app/data/inputs            # 读取 Jonex parsed artifact / 原始文件引用
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7566/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      llm-gateway:
        condition: service_started

  # ============================================================
  # jonex-wiki - 单容器（B1）：引擎 + Jonex Atomic Capability 同进程 pydantic v2
  # ============================================================
  # 运行 deploy/docker/jonex-wiki.Dockerfile：alembic upgrade head + start_capability.py（8007）。
  # B1：JonexWikiCapability 进程内 import jonex_wiki 调 WikiApplication，无独立 adapter / HTTP 转调。
  # Sidecar 通过 JONEX_WIKI_URL 指向本容器（8007）。
  # ============================================================
  jonex-wiki:
    build:
      context: ..
      dockerfile: deploy/docker/jonex-wiki.Dockerfile
      args:
        USE_OVERSEAS_MIRROR: ${USE_OVERSEAS_MIRROR:-false}
    container_name: jonex-wiki
    hostname: jonex-wiki
    image: jonex-wiki-server
    networks:
      - jonex-network
    expose:
      - "8007"                      # 仅容器内，Sidecar 通过此端口调用 /invoke
    environment:
      # Short-lived query progress sessions use the same Redis as knowledge-base.
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env.jonex_wiki             # 引擎专属环境变量（JONEX_WIKI_* / LLM_BINDING_* / DB_*）
    volumes:
      - jonex-wiki-storage:/data/jonex-wiki   # 引擎产物根（compile/query bundles）
      - jonex-rag-inputs:/app/inputs           # 读取 Jonex parsed artifact（共享卷）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      llm-gateway:
        condition: service_started

  # ============================================================
  # ontology-compile - 本体编译独立容器（P2）：能力 + worker 同进程（8009）
  # ============================================================
  # 运行 deploy/docker/ontology-compile.Dockerfile：start_capability.py（8009）。
  # 无引擎源码、无 GPU、无迁移 —— 只装 jonex_core + 平台依赖。
  # Sidecar 通过 ONTOLOGY_COMPILE_URL 指向本容器（8009）；能力 ID atomic.ontology_compile.v1。
  # 端口 8009 没有被任何其它服务用作 SERVICE_PORT/ports，且本服务只 expose 不发布宿主端口
  # ⇒ 容器网络内无冲突（本文件 :551 的 ONTOLOGY_COMPILE_URL 即指向本容器的 8009）。
  # 灰度开关是 ONTOLOGY_COMPILE_BACKEND（库级列 + KB 侧接线）；**P4a 2026-10-17 起
  #   提交默认已是 `ontology_compile`** —— 本容器就是 compile 步的默认执行方
  #   （回滚 = 设 `ONTOLOGY_COMPILE_BACKEND=rag` + 重启 knowledge-base）。
  # ============================================================
  ontology-compile:
    build:
      context: ..
      dockerfile: deploy/docker/ontology-compile.Dockerfile
      args:
        USE_OVERSEAS_MIRROR: ${USE_OVERSEAS_MIRROR:-false}
    container_name: ontology-compile
    hostname: ontology-compile
    image: ontology-compile-server
    networks:
      - jonex-network
    expose:
      - "8009"
    env_file:
      - .env.ontology_compile
    # ⚠ 必须与 atomic-rag **逐值同口径**，否则两边算出的存档目录不同（静默读空，见下）
    environment:
      KB_INPUT_DIR: /app/inputs
      WORKING_DIR: /app/rag_storage
      # ⚠ 能力清单：locator 找清单的顺序是 CAPABILITY_RUNTIME_FILE → cwd/capability_runtime.yaml
      #   → 内置默认（**全部 LOCAL**）。容器 WORKDIR=/app、清单却在 /app/deploy/config/
      #   下 ⇒ 不指这条就**读不到清单**，LOCAL 分支会抛
      #   OperationNotSupportedError（client.py 有意不静默回落）。
      #   与 knowledge-base-service / atomic-rag 同款：值 + 挂载**成对**，缺一不可。
      CAPABILITY_RUNTIME_FILE: /app/config/capability_runtime.yaml
      # DB 连接：**照房规用 compose 插值拼**（同本文件各能力容器的 `${DB_*}` 注入），
      #   而不是在 .env.ontology_compile 里写死口令 —— 口令若写死，改 `DB_PASSWORD` 时
      #   不会被 rotate_secrets 同步（它在 FILL_MISSING_EXCLUDED + ROTATE_REQUIRES_OPT_IN 里），
      #   容器必然崩循环（`docker compose ps` 永远 Restarting、日志只有连接失败）。
      #   同类服务上已踩过（见 deploy/README.md）。
      #   compose 的 `environment:` 优先级高于 `env_file:`，故模板里那行已注释掉。
      ONTOLOGY_COMPILE_DATABASE_URL: postgresql+asyncpg://${DB_USERNAME:-jonex}:${DB_PASSWORD:-change-me}@postgres:5432/${DB_NAME:-jonex}
    volumes:
      # ⚠️ 设计 §4.5：extract_only 要读 atomic-rag 写在共享卷上的表格上下文存档；
      # 漏了它不报错，只是 _load_table_context 读回 None → P0-b 把有表格的文档判为拒绝重抽。
      # ✅ 2026-10-16 **真机实测**（controller 已跑，值即下文，照抄）：
      #   $ docker exec jonex-atomic-rag printenv WORKING_DIR KB_INPUT_DIR RAG_TABLE_CTX_DIR
      #     /app/rag_storage          ← WORKING_DIR
      #     /app/inputs               ← KB_INPUT_DIR   （RAG_TABLE_CTX_DIR 未设，无第三行）
      #   $ docker inspect jonex-atomic-rag --format '{{range .Mounts}}{{.Name}} -> {{.Destination}}{{println}}{{end}}'
      #     deploy_jonex-rag-storage -> /app/rag_storage (rw)
      #     deploy_jonex-rag-inputs  -> /app/inputs      (rw)
      #   $ docker exec jonex-atomic-rag ls /app/inputs
      #     _table_ctx  jonex  parsed    ← **_table_ctx 真实存在且非空**
      # 结论：存档 = `_table_context_dir()` 回落链 RAG_TABLE_CTX_DIR(未设) → KB_INPUT_DIR(= /app/inputs)
      #       ⇒ 落在 **jonex-rag-inputs** 卷；故本服务必须挂它并设同值 KB_INPUT_DIR。
      # 挂 rw（非 ro）：本服务在编译时**自己写档**（设计 §4.5）。
      # ⚠ 存量注释曾把 lightrag 段（compose :914-915 的 /app/data/…）误当 atomic-rag，已订正。
      - jonex-rag-inputs:/app/inputs
      - jonex-rag-storage:/app/rag_storage
      # 与 knowledge-base-service / atomic-rag 同款的两个只读配置挂载（Task 5 补充）：
      #   ① 能力清单 —— 见上面 CAPABILITY_RUNTIME_FILE 那条（缺它 chunk 自取直接失败）；
      #   ② TBox yaml —— compiled schema 缺失时 compiled_schema_client 回落它。
      #      ⚠ 必须**挂载**而不是只靠镜像里 COPY deploy/ 的那一份：同一份 TBox 在
      #      kb / atomic-rag 两侧都是活挂载，本服务若独用一份烘死的旧副本，
      #      抽取就会被另一版 TBox 约束（差异静默，只在实体/关系种类上显形）。
      - ./config/capability_runtime.yaml:/app/config/capability_runtime.yaml:ro
      - ./config/ontology:/app/deploy/config/ontology:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================
  # MCP Server - 知识库 MCP Tool 注册与鉴权
  # ============================================================
  # 配置文件：deploy/.env.mcp（MCP Server 专用，与平台主配置分离）
  # MCP Server 仅容器间通信——AI 客户端经 Nginx 反向代理到达，
  # Nginx 通过 jonex-network 内部路由到 mcp-server:8002
  # Phase 2 MCP Key 鉴权中间件就绪前不对外暴露端口
  mcp-server:
    build:
      context: ..
      dockerfile: mcp_server/Dockerfile
    container_name: jonex-mcp-server
    hostname: mcp-server
    networks:
      - jonex-network
    # 不发布宿主端口（生产）：MCP 客户端经 443 进来
    # （deploy/nginx/app-locations.conf 的 `location /mcp` 已 proxy_pass http://mcp-server:8002）。
    # 本地调试映射见 docker-compose.override.yml。
    env_file:
      - .env.mcp                    # 仅 mcp-server 加载此文件
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================
  # Neo4j - 本体图数据库（社区版，单 database）
  # 存储：本体 ABox（:OntologyEntity label）+ LightRAG 图谱（workspace label）
  # ============================================================
  neo4j:
    image: neo4j:5.26-community
    container_name: jonex-neo4j
    hostname: neo4j
    networks:
      - jonex-network
    # 不发布宿主端口（生产）：本地调试（browser / bolt）映射见 docker-compose.override.yml
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512M}
      TZ: Asia/Shanghai
    volumes:
      - jonex-neo4j-data:/data
      - jonex-neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # ============================================================
  # 身份同步侧车 —— Jonex标准拉取契约 ⇄ Casdoor Admin API
  # 平台按服务名寻址：http://identity-sync-gateway:8099
  # 默认不随 make up 起（profiles 隔离）：
  #   docker compose --profile identity-sync-gateway up -d
  # 详见 deploy/identity-sync-gateway/README.md
  # ============================================================
  identity-sync-gateway:
    build:
      context: ./identity-sync-gateway
      dockerfile: Dockerfile
    container_name: jonex-identity-sync-gateway
    hostname: identity-sync-gateway
    profiles: ["identity-sync-gateway"]
    networks:
      - jonex-network
    ports:
      # 只绑宿主回环：平台走 compose 内网按服务名寻址，这条映射仅供本地调试
      - "127.0.0.1:8099:8099"
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # ⚠️ 端口映射固定 8099；改这里的值须同步改上面的 ports
      DATASOURCE_GATEWAY_PORT: ${DATASOURCE_GATEWAY_PORT:-8099}
      # 鉴权 token（必填）：须与平台租户 UI 里填的 token 同值，缺失则容器启动即退出
      DATASOURCE_GATEWAY_TOKEN: ${DATASOURCE_GATEWAY_TOKEN:-}
      DATASOURCE_GATEWAY_INCREMENTAL_MODE: ${DATASOURCE_GATEWAY_INCREMENTAL_MODE:-time_window}
      # 上游 IdP（Casdoor）连接，键名沿用平台既有 MOCK_DATASOURCE_* 前缀
      MOCK_DATASOURCE_BASE_URL: ${MOCK_DATASOURCE_BASE_URL:-}
      MOCK_DATASOURCE_OWNER: ${MOCK_DATASOURCE_OWNER:-}
      MOCK_DATASOURCE_ADMIN_USER: ${MOCK_DATASOURCE_ADMIN_USER:-}
      MOCK_DATASOURCE_ADMIN_PASSWORD: ${MOCK_DATASOURCE_ADMIN_PASSWORD:-}
      MOCK_DATASOURCE_PAGE_SIZE: ${MOCK_DATASOURCE_PAGE_SIZE:-100}
      MOCK_DATASOURCE_USERNAMES: ${MOCK_DATASOURCE_USERNAMES:-}
    healthcheck:
      # 基础镜像无 curl，用 python 探针
      test: ["CMD", "python", "-c", "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8099/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

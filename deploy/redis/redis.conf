# ============================================================
# Jonex 平台 Redis 配置文件
# ============================================================

# 绑定地址（允许所有地址访问
bind 0.0.0.0

# 端口
port 6379

# 密码（生产环境请设置强密码
# requirepass your_redis_password

# 持久化配置
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 内存配置
maxmemory 2gb
maxmemory-policy allkeys-lru

# 日志级别
loglevel notice

# 数据库数量
databases 16

# 超时设置
timeout 300

# 客户端连接数
maxclients 10000

# 慢日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 延迟监控
latency-monitor-threshold 100

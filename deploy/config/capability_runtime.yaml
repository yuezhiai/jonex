# ============================================================
# 能力运行时清单 — 知识库容器
# ============================================================
# 业务能力容器（knowledge-base）不具备解析器环境，
# RAG 调用必须通过 Sidecar 反代到 atomic-rag 服务。
# ============================================================
atomic:
  rag.lightrag:
    mode: remote
    # endpoint 留空则自动使用 SIDECAR_URL 环境变量
  openkb:
    mode: remote
    # endpoint 留空走 SIDECAR_URL 默认值
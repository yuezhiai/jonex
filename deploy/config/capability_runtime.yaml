# ============================================================
# 能力运行时清单 — 知识库容器
# ============================================================
# 业务能力容器（knowledge-base）不具备解析器环境，
# RAG 调用必须通过 Sidecar 反代到 atomic-rag 服务。
# ============================================================
atomic:
  rag.lightrag:
    mode: remote
    # endpoint 留空则自动使用 SIDECAR_URL 环境变量
  openkb:
    mode: remote
    # endpoint 留空走 SIDECAR_URL 默认值
  jonex_wiki:
    mode: remote
    # endpoint 留空走 SIDECAR_URL 默认值
  ontology_compile:
    mode: remote
    # endpoint 留空走 SIDECAR_URL 默认值
    # [jonex] P2 独立容器（atomic.ontology_compile.v1）。**必须声明 remote**：
    # 未声明时 get_spec 会兜底成 LOCAL，而 `get_ontology_compile_client()` 对 LOCAL
    # **显式报错**（client.py 只支持 MOCK / REMOTE，不做静默回落）⇒ 调用即失败。
    # 灰度开关是 ONTOLOGY_COMPILE_BACKEND（库级列 + KB 侧接线）；**P4a 2026-10-17 起
    #   提交默认已是 `ontology_compile`**（回滚 = 设 `ONTOLOGY_COMPILE_BACKEND=rag` + 重启）。
# ============================================================
# 业务能力
# ============================================================
# ⚠️ 这两条**必须声明成 remote**，少一条都会让 Ontology 库接入任务中心整条链失效：
#
# - `business.task_center.v1` —— 知识库**调任务中心**（`runtime.submit` /
#   `report_terminal`）走它。不声明的话 `get_spec` 会兜底成 LOCAL
#   （`jonex_core/capability/locator.py`），`LocalTaskCenterClient` 去**本进程**的
#   能力注册中心里找任务中心 —— 本容器不注册它、找不到 → 回 1002 →
#   SDK 判 `PERMANENT_REJECTED` → **每次上传都建不了任务**。
# - `business.knowledge_base.v1` —— 任务中心**派活回知识库**（RunnerAdapter 按
#   `task_catalog_steps.runner_code = 'knowledge_base'` 查 `runner_definitions`
#   拿到这个 capability_id）要按它决定送到哪。同样不能是 LOCAL：发送侧在本进程里
#   找不到这个 capability（它自己就是 knowledge_base，注册中心里没有「调用自己」
#   这条能力）→ 每次都判 `REJECTED` → 子任务直接终态 failed。
business:
  business.task_center.v1:
    mode: remote
    # endpoint 留空走 SIDECAR_URL 默认值
  business.knowledge_base.v1:
    mode: remote
    # endpoint 留空走 SIDECAR_URL 默认值
# ============================================================
# 通用企业知识本体定义（TBox）
# ============================================================
# 领域：跨行业的企业/组织/人/产品/事件/地点/文档/概念/方法通用建模。
# 适用语料：企业介绍、产品资料、项目文档、制度合同、事故报告、经营分析等。
#
# 与 default.yaml 的关系：
#   - default.yaml 是抽取兜底本体，保持轻量，不承载层级；
#   - 本文件是「可导入的通用建模层」，带完整类层次、关系层次、数据属性层次，
#     通过编译 YAML 导入或 Studio 发布进入 KB，不改默认兜底。
#
# 结构：
#   - entity_types：实体类型（name / aliases / attributes / status）
#   - relation_types：关系类型（name / source / target / source_types / target_types）
#   - constraints：抽取后校验约束
#   - axioms：类层次 / 关系层次 / 数据属性层次 / 特征 / propertyChain / datatypeFacet
#   - disambiguation：名称解析口径
#
# 配套推理规则：generic_enterprise.rules.yaml
#   （先导入本 TBox，再导入规则；规则引用本文件的类型与关系名）

version: 1
domain: generic_enterprise

entity_types:
  # ── 组织 ───────────────────────────────────────────────
  - name: Organization
    display_name: 组织
    description: "泛指各类组织，Company / GovernmentAgency / ResearchInstitution 是其子类"
    aliases: ["组织", "机构", "单位"]
    attributes:
      - { name: legal_name, type: string, required: false, description: "法定全称或官方名称（原文有值才填）" }
      - { name: identifier, type: string, required: false, description: "组织统一标识（统一社会信用代码/注册号等）" }
      - { name: org_type, type: enum, required: false, description: "组织类型：company/government/research/ngo/other" }
      - { name: industry, type: string, required: false, description: "所属行业（原文有值才填）" }
      - { name: country, type: string, required: false, description: "所属国家/地区" }
      - { name: website, type: string, required: false, description: "官方网站" }
      - { name: employee_count, type: number, required: false, description: "员工人数（纯数字）" }
      - { name: founded_date, type: date, required: false, description: "成立日期" }
    extraction_skills:
      constrain:
        - { skill: builtin:no_fabrication, description: "属性值必须可在 chunk 原文摘句，不在原文置空（宁缺毋假）" }

  - name: Company
    display_name: 公司
    description: "以营利为目的的企业法人，Organization 的子类"
    aliases: ["公司", "企业", "厂商", "集团", "品牌方"]
    attributes:
      - { name: stock_code, type: string, required: false, description: "证券代码（如 1810.HK）" }
      - { name: company_type, type: enum, required: false, description: "listed/unlisted/state_owned/private" }
    extraction_skills:
      constrain:
        - { skill: builtin:no_fabrication, description: "属性值必须可在 chunk 原文摘句，不在原文置空（宁缺毋假）" }

  - name: GovernmentAgency
    display_name: 政府机构
    description: "政府部门、监管机构或事业单位，Organization 的子类"
    aliases: ["政府", "部门", "监管机构", "委员会", "事业单位"]
    attributes:
      - { name: jurisdiction, type: string, required: false, description: "管辖范围（国家/省/市/行业）" }
      - { name: agency_level, type: enum, required: false, description: "national/provincial/municipal/industry" }

  - name: ResearchInstitution
    display_name: 研究机构
    description: "高校、研究院、实验室等，Organization 的子类"
    aliases: ["研究院", "研究所", "高校", "大学", "实验室", "研究中心"]
    attributes:
      - { name: research_field, type: string, required: false, description: "研究领域" }
      - { name: institution_type, type: enum, required: false, description: "university/institute/lab/center" }

  # ── 人 ─────────────────────────────────────────────────
  - name: Person
    display_name: 人员
    description: "泛指自然人，Employee / Expert 是其子类"
    aliases: ["人", "人员", "个人"]
    attributes:
      - { name: title, type: string, required: false, description: "职务/头衔" }
      - { name: role, type: string, required: false, description: "在当前语境中的角色" }
      - { name: email, type: string, required: false, description: "电子邮箱" }
      - { name: nationality, type: string, required: false, description: "国籍" }
    extraction_skills:
      constrain:
        - { skill: builtin:no_fabrication, description: "属性值必须可在 chunk 原文摘句，不在原文置空（宁缺毋假）" }

  - name: Employee
    display_name: 员工
    description: "与组织存在劳动/任职关系的个人，Person 的子类"
    aliases: ["员工", "职员", "职工", "任职人员"]
    attributes:
      - { name: employee_no, type: string, required: false, description: "工号/员工编号" }
      - { name: department, type: string, required: false, description: "所属部门" }
      - { name: position, type: string, required: false, description: "岗位" }

  - name: Expert
    display_name: 专家
    description: "在某一领域具备专业能力的人，Person 的子类"
    aliases: ["专家", "学者", "顾问", "研究员"]
    attributes:
      - { name: expertise, type: string, required: false, description: "专业领域" }
      - { name: affiliation, type: string, required: false, description: "所属机构" }
      - { name: years_experience, type: number, required: false, description: "从业年限（纯数字）" }

  # ── 产品 ───────────────────────────────────────────────
  - name: Product
    display_name: 产品
    description: "组织提供的产品/服务，HardwareProduct / SoftwareProduct / ServiceOffering 是其子类"
    aliases: ["产品", "商品", "解决方案"]
    attributes:
      - { name: model, type: string, required: false, description: "型号/规格标识" }
      - { name: version, type: string, required: false, description: "产品版本号" }
      - { name: category, type: string, required: false, description: "产品品类" }
      - { name: brand, type: string, required: false, description: "品牌名称" }
      - { name: price, type: number, required: false, description: "标准价格（纯数字，币种见 currency）" }
      - { name: currency, type: string, required: false, description: "价格币种，如 CNY/USD" }
      - { name: release_date, type: date, required: false, description: "发布/上市日期" }
    extraction_skills:
      constrain:
        - { skill: builtin:no_fabrication, description: "属性值必须可在 chunk 原文摘句，不在原文置空（宁缺毋假）" }

  - name: HardwareProduct
    display_name: 硬件产品
    description: "有物理形态的产品，Product 的子类"
    aliases: ["硬件", "设备", "终端", "机器", "部件"]
    attributes:
      - { name: serial_no, type: string, required: false, description: "序列号/出厂编号" }
      - { name: weight, type: string, required: false, description: "重量（含单位）" }
      - { name: power_rating, type: string, required: false, description: "额定功率（含单位）" }

  - name: SoftwareProduct
    display_name: 软件产品
    description: "软件、平台或应用，Product 的子类"
    aliases: ["软件", "系统", "平台", "应用", "App", "工具"]
    attributes:
      - { name: version, type: string, required: false, description: "软件版本号（原文有值才填）" }
      - { name: platform, type: string, required: false, description: "运行平台" }
      - { name: license_model, type: enum, required: false, description: "proprietary/open_source/freemium/subscription" }

  - name: ServiceOffering
    display_name: 服务
    description: "组织提供的服务型产品，Product 的子类"
    aliases: ["服务", "咨询", "运维", "外包"]
    attributes:
      - { name: service_level, type: string, required: false, description: "服务等级/SLA" }
      - { name: delivery_mode, type: enum, required: false, description: "onsite/remote/hybrid/self_service" }

  # ── 事件 ───────────────────────────────────────────────
  - name: Event
    display_name: 事件
    description: "在特定时间发生的事项，Meeting / Incident / Campaign 是其子类"
    aliases: ["事件", "活动", "事项"]
    attributes:
      - { name: date, type: date, required: false, description: "发生日期" }
      - { name: event_type, type: enum, required: false, description: "事件类型" }
      - { name: description, type: text, required: false, description: "事件描述" }
    extraction_skills:
      constrain:
        - { skill: builtin:no_fabrication, description: "属性值必须可在 chunk 原文摘句，不在原文置空（宁缺毋假）" }

  - name: Meeting
    display_name: 会议
    description: "有议程的集会/评审/例会，Event 的子类"
    aliases: ["会议", "评审会", "例会", "研讨会"]
    attributes:
      - { name: agenda, type: text, required: false, description: "会议议程" }
      - { name: location_text, type: string, required: false, description: "会议地点（原文写法）" }

  - name: Incident
    display_name: 事故
    description: "造成损失或异常的突发事件，Event 的子类"
    aliases: ["事故", "故障", "异常", "安全事件"]
    attributes:
      - { name: severity, type: enum, required: false, description: "low/medium/high/critical" }
      - { name: impact_scope, type: text, required: false, description: "影响范围" }

  - name: Campaign
    display_name: 活动
    description: "有明确目标的营销/推广活动，Event 的子类"
    aliases: ["营销活动", "推广活动", "促销活动", "专项活动"]
    attributes:
      - { name: budget, type: number, required: false, description: "活动预算（纯数字）" }
      - { name: channel, type: string, required: false, description: "投放/执行渠道" }

  # ── 地点 ───────────────────────────────────────────────
  - name: Location
    display_name: 地点
    description: "地理或物理位置，Facility / Region 是其子类"
    aliases: ["地点", "位置", "场所"]
    attributes:
      - { name: address, type: string, required: false, description: "详细地址" }
      - { name: region_code, type: string, required: false, description: "行政区划代码" }
      - { name: country, type: string, required: false, description: "国家/地区" }

  - name: Facility
    display_name: 设施
    description: "工厂、园区、门店、机房等物理设施，Location 的子类"
    aliases: ["工厂", "园区", "门店", "机房", "设施", "基地"]
    attributes:
      - { name: facility_type, type: enum, required: false, description: "factory/office/store/data_center/warehouse" }
      - { name: capacity, type: string, required: false, description: "产能/容量（含单位）" }

  - name: Region
    display_name: 区域
    description: "国家、省、市等行政或市场区域，Location 的子类"
    aliases: ["地区", "城市", "国家", "省", "区域市场"]
    attributes:
      - { name: region_level, type: enum, required: false, description: "country/province/city/district" }
      - { name: parent_region, type: string, required: false, description: "上级区域名称" }

  # ── 文档 ───────────────────────────────────────────────
  - name: Document
    display_name: 文档
    description: "结构化或半结构化文件，Contract / Policy / Report 是其子类"
    aliases: ["文档", "文件", "资料"]
    attributes:
      - { name: doc_no, type: string, required: false, description: "文档编号" }
      - { name: doc_type, type: enum, required: false, description: "contract/policy/report/notice/manual" }
      - { name: version, type: string, required: false, description: "文档版本" }
      - { name: publish_date, type: date, required: false, description: "发布日期" }
      - { name: source_url, type: string, required: false, description: "来源链接" }
    extraction_skills:
      constrain:
        - { skill: builtin:no_fabrication, description: "属性值必须可在 chunk 原文摘句，不在原文置空（宁缺毋假）" }

  - name: Contract
    display_name: 合同
    description: "双方或多方约定权利义务的文件，Document 的子类"
    aliases: ["合同", "协议", "合约"]
    attributes:
      - { name: contract_no, type: string, required: false, description: "合同编号" }
      - { name: effective_date, type: date, required: false, description: "生效日期" }
      - { name: expiry_date, type: date, required: false, description: "到期日期" }
      - { name: amount, type: number, required: false, description: "合同金额（纯数字）" }

  - name: Policy
    display_name: 制度
    description: "组织内部制度、政策或管理规定，Document 的子类"
    aliases: ["制度", "政策", "规定", "管理办法"]
    attributes:
      - { name: policy_no, type: string, required: false, description: "制度编号" }
      - { name: issuing_authority, type: string, required: false, description: "发布机构" }

  - name: Report
    display_name: 报告
    description: "经营、审计、调研等报告，Document 的子类"
    aliases: ["报告", "报表", "调研报告", "审计报告"]
    attributes:
      - { name: report_no, type: string, required: false, description: "报告编号" }
      - { name: reporting_period, type: string, required: false, description: "报告期间" }

  # ── 概念 ───────────────────────────────────────────────
  - name: Concept
    display_name: 概念
    description: "业务概念/术语，Metric / Standard 是其子类"
    aliases: ["概念", "术语", "定义"]
    attributes:
      - { name: definition, type: text, required: false, description: "概念定义" }
      - { name: category, type: string, required: false, description: "概念分类" }

  - name: Metric
    display_name: 指标
    description: "可度量的业务指标，Concept 的子类"
    aliases: ["指标", "度量", "KPI"]
    attributes:
      - { name: metric_unit, type: string, required: false, description: "指标单位" }
      - { name: metric_value, type: number, required: false, description: "指标值（纯数字）" }
      - { name: period, type: string, required: false, description: "统计周期" }

  - name: Standard
    display_name: 标准
    description: "行业/国家/国际标准或规范，Concept 的子类"
    aliases: ["标准", "规范", "准则"]
    attributes:
      - { name: standard_code, type: string, required: false, description: "标准编号" }
      - { name: issuing_body, type: string, required: false, description: "发布机构" }
      - { name: edition, type: string, required: false, description: "版本/版次" }

  # ── 方法 ───────────────────────────────────────────────
  - name: Method
    display_name: 方法
    description: "做事的方法/技术/流程，Process / Technology 是其子类"
    aliases: ["方法", "手段", "做法"]
    attributes:
      - { name: definition, type: text, required: false, description: "方法定义" }
      - { name: method_type, type: enum, required: false, description: "process/technology/algorithm/policy_measure" }

  - name: Process
    display_name: 流程
    description: "有步骤和角色的业务流程，Method 的子类"
    aliases: ["流程", "过程", "工序", "作业流程"]
    attributes:
      - { name: owner_role, type: string, required: false, description: "流程负责人角色" }
      - { name: cycle_time, type: string, required: false, description: "流程周期（含单位）" }

  - name: Technology
    display_name: 技术
    description: "可复用的技术/工艺/算法，Method 的子类"
    aliases: ["技术", "科技", "工艺", "算法"]
    attributes:
      - { name: maturity_level, type: enum, required: false, description: "research/pilot/production/deprecated" }
      - { name: vendor, type: string, required: false, description: "技术提供方" }

  # ── 规程 ───────────────────────────────────────────────
  - name: Skill
    display_name: 技能
    description: "可执行的业务能力项/作业项"
    aliases: ["技能", "能力项", "作业项", "规程"]
    attributes:
      - { name: definition, type: text, required: false, description: "技能语义定义" }
      - { name: skill_domain, type: string, required: false, description: "所属领域" }
      - { name: goal, type: text, required: false, description: "技能目标" }
      - { name: prerequisites, type: text, required: false, description: "技能级前置条件（换行分隔）" }

  - name: Action
    display_name: 动作
    description: "技能中的具体执行步骤"
    aliases: ["动作", "操作", "步骤", "处置"]
    attributes:
      - { name: definition, type: text, required: false, description: "动作语义定义" }
      - { name: action_type, type: enum, required: false, description: "operation/decision/interaction/validation" }
      - { name: step_no, type: number, required: false, description: "步骤序号" }
      - { name: authorization, type: text, required: false, description: "权限要求" }
      - { name: prerequisites, type: text, required: false, description: "前置条件" }
      - { name: audit_required, type: boolean, required: false, description: "是否需要审计留痕" }

relation_types:
  - name: RELATES_TO
    source: Concept
    target: Concept
    source_types: [Organization, Company, GovernmentAgency, ResearchInstitution, Person, Employee, Expert, Product, HardwareProduct, SoftwareProduct, ServiceOffering, Event, Meeting, Incident, Campaign, Location, Facility, Region, Document, Contract, Policy, Report, Concept, Metric, Standard, Method, Process, Technology, Skill, Action]
    target_types: [Organization, Company, GovernmentAgency, ResearchInstitution, Person, Employee, Expert, Product, HardwareProduct, SoftwareProduct, ServiceOffering, Event, Meeting, Incident, Campaign, Location, Facility, Region, Document, Contract, Policy, Report, Concept, Metric, Standard, Method, Process, Technology, Skill, Action]
    description: "通用关联（无更精确关系时的兜底类型）"

  - name: BELONGS_TO
    source: Person
    target: Organization
    source_types: [Person, Employee, Expert]
    target_types: [Organization, Company, GovernmentAgency, ResearchInstitution]
    description: "人员隶属于某个组织"

  - name: EMPLOYS
    source: Organization
    target: Person
    source_types: [Organization, Company, GovernmentAgency, ResearchInstitution]
    target_types: [Person, Employee, Expert]
    description: "组织雇佣/任职人员"

  - name: WORKS_AT
    source: Person
    target: Organization
    source_types: [Person, Employee, Expert]
    target_types: [Organization, Company, GovernmentAgency, ResearchInstitution]
    description: "人员在某组织工作"

  - name: WORKS_WITH
    source: Person
    target: Person
    source_types: [Person, Employee, Expert]
    target_types: [Person, Employee, Expert]
    description: "人员之间的协作关系"

  - name: SUBSIDIARY_OF
    source: Company
    target: Company
    source_types: [Company]
    target_types: [Company]
    description: "子公司/分支机构隶属于母公司"

  - name: PARTNER_OF
    source: Organization
    target: Organization
    source_types: [Organization, Company, GovernmentAgency, ResearchInstitution]
    target_types: [Organization, Company, GovernmentAgency, ResearchInstitution]
    description: "组织之间的合作关系"

  - name: CONTRACTS_WITH
    source: Organization
    target: Organization
    source_types: [Organization, Company, GovernmentAgency, ResearchInstitution]
    target_types: [Organization, Company, GovernmentAgency, ResearchInstitution]
    description: "组织之间的合同关系"

  - name: PART_OF
    source: Product
    target: Product
    source_types: [Organization, Product, HardwareProduct, SoftwareProduct, ServiceOffering, Facility, Document, Contract, Policy, Report, Concept, Metric, Standard]
    target_types: [Organization, Product, HardwareProduct, SoftwareProduct, ServiceOffering, Facility, Document, Contract, Policy, Report, Concept, Metric, Standard]
    description: "部分-整体关系（部件属于整体）"

  - name: HAS_PART
    source: Product
    target: Product
    source_types: [Organization, Product, HardwareProduct, SoftwareProduct, ServiceOffering, Facility, Document, Contract, Policy, Report, Concept, Metric, Standard]
    target_types: [Organization, Product, HardwareProduct, SoftwareProduct, ServiceOffering, Facility, Document, Contract, Policy, Report, Concept, Metric, Standard]
    description: "整体包含部分"

  - name: PRODUCES
    source: Organization
    target: Product
    source_types: [Organization, Company, GovernmentAgency, ResearchInstitution]
    target_types: [Product, HardwareProduct, SoftwareProduct, ServiceOffering]
    description: "组织生产/提供产品"

  - name: PROVIDES
    source: Organization
    target: ServiceOffering
    source_types: [Organization, Company, GovernmentAgency, ResearchInstitution]
    target_types: [ServiceOffering]
    description: "组织提供服务型产品"

  - name: MANUFACTURES
    source: Organization
    target: HardwareProduct
    source_types: [Organization, Company, GovernmentAgency, ResearchInstitution]
    target_types: [HardwareProduct]
    description: "组织制造硬件产品"

  - name: HAS_PRODUCT_FEATURE
    source: Organization
    target: Concept
    source_types: [Organization, Company, GovernmentAgency, ResearchInstitution]
    target_types: [Concept, Metric, Standard]
    description: "组织的产品具备某功能/特性（经产品间接推导）"

  - name: HAS_FEATURE
    source: Product
    target: Concept
    source_types: [Product, HardwareProduct, SoftwareProduct, ServiceOffering]
    target_types: [Concept, Metric, Standard]
    description: "产品包含某功能/特性"

  - name: USES
    source: Organization
    target: Method
    source_types: [Organization, Company, GovernmentAgency, ResearchInstitution]
    target_types: [Method, Process, Technology]
    description: "组织采用某方法/技术/流程"

  - name: USES_TOOL
    source: Organization
    target: Product
    source_types: [Organization, Company, GovernmentAgency, ResearchInstitution, Action]
    target_types: [Product, HardwareProduct, SoftwareProduct, ServiceOffering]
    inverse_of: USED_IN
    description: "组织/动作使用的工具或产品"

  - name: IMPLEMENTS
    source: Product
    target: Method
    source_types: [Product, HardwareProduct, SoftwareProduct, ServiceOffering]
    target_types: [Method, Process, Technology]
    description: "产品实现/采用某方法或技术"

  - name: APPLIED_TO
    source: Method
    target: Product
    source_types: [Method, Process, Technology]
    target_types: [Product, HardwareProduct, SoftwareProduct, ServiceOffering]

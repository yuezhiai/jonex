  - name: WORKS_AT
    source: Person
    target: Organization
    description: "人员任职于某机构/品牌/运营方"

  - name: AWARDED
    source: Organization
    target: Award
    description: "机构/项目获得某奖项或荣誉"

  # ── 活动、优惠与会员 ─────────────────────────────────────
  - name: HELD_AT
    source: Campaign
    target: Mall
    description: "活动在某项目举办（跨店活动需对每个参与项目分别建边）"

  - name: HAS_SUB_EVENT
    source: Campaign
    target: Event
    description: "大促包含具体现场活动/演艺/展览/抽奖等子活动"

  - name: HOSTS_EVENT
    source: Mall
    target: Event
    description: "项目举办某现场活动（不隶属大促时使用）"

  - name: PARTICIPATES_IN

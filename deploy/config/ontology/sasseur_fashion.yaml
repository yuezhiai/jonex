    target: Campaign
    description: "品牌参与某活动（逐个品牌建边，支撑「哪些品牌参加了年庆」类查询）"

  - name: FEATURES_PERSON
    source: Event
    target: Person
    description: "活动出现某嘉宾/艺人/达人/主持人"

  - name: OFFERS_PROMOTION
    source: Campaign
    target: Promotion
    description: "活动提供某项优惠机制（一个活动通常挂多条 Promotion，必须逐条穷举）"

  - name: BRAND_OFFERS_PROMOTION
    source: Brand
    target: Promotion
    description: "品牌自有优惠（区别于商场统一优惠，避免把品牌折扣误挂到全场）"

  - name: PROMOTION_APPLIES_TO
    source: Promotion
    target: ApparelItem
    description: "优惠适用于某单品/品类（含除外情形请写入 excluded_scope）"

  - name: PROMOTION_EXCLUSIVE_TO
    source: Promotion
    target: MembershipTier
    description: "优惠为某会员等级专享"

  - name: HAS_MEMBERSHIP_TIER
    source: Mall
    target: MembershipTier
    description: "项目/运营方设有某会员等级"

  - name: SUCCEEDS_EDITION
    source: Campaign
    target: Campaign
    description: "活动届次接续（如第 12 届年庆紧接第 11 届），支撑同比与届数推理"

  - name: SCHEDULED_IN
    source: Campaign
    target: Season

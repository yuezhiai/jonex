    target: Accessory
    description: "单品与配饰的搭配组合（如西装外套配乐福鞋）"

  - name: CLASHES_WITH
    source: ApparelItem
    target: ApparelItem
    description: "不建议同穿的组合（避坑类结论必须显式建边，别只留在文本里）"

  - name: HAS_STYLE
    source: Outfit
    target: StyleGenre
    description: "整套搭配呈现某风格"

  - name: ITEM_FITS_STYLE
    source: ApparelItem
    target: StyleGenre
    description: "单品契合某风格（用于按风格选品）"

  - name: SUITABLE_FOR_OCCASION
    source: Outfit
    target: Occasion
    description: "搭配适用于某场合（通勤/约会/宴会/旅行等）"

  - name: ITEM_SUITABLE_FOR_OCCASION
    source: ApparelItem
    target: Occasion
    description: "单品适用于某场合"

  - name: SUITABLE_FOR_BODY
    source: Outfit
    target: BodyType
    description: "搭配适合某体型（含显高/显瘦等修饰目标）"

  - name: ITEM_SUITABLE_FOR_BODY
    source: ApparelItem
    target: BodyType

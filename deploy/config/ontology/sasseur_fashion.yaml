# ============================================================
# 砂之船奥莱（超大型奥特莱斯商业综合体）· 服装搭配与商业活动本体定义（TBox）
# ============================================================
# 领域：奥特莱斯零售运营 / 品牌与门店 / 大促与年庆活动 / 服装单品与穿搭搭配
# 适用语料：探店与穿搭类短视频 + 图文（小红书/抖音/视频号）、活动海报与规则页、
#          品牌折扣清单、会员权益说明、商场运营与业绩公告（含 Sasseur REIT 公告）。
#
# 结构参考 deploy/config/ontology/technology.yaml 与 default.yaml：
#   - entity_types：实体类型（name / aliases / attributes）
#   - relation_types：关系类型（name / source / target / description）
#   - attribute.type 取值：string | text | number | date | enum | boolean
#   - OntologyRegistry 初始化时加载，供 OntologyExtractor 在 LLM 抽取阶段使用。
#
# 领域事实锚点（来自公开资料，用于对齐实体命名与消歧）：
#   - 砂之船集团以国际化大型奥特莱斯商业运营为核心，主打「艺术商业」基因，
#     单项目常以「砂之船艺术商业广场」形态出现，由奥特莱斯、意大利购物村、
#     儿童世界、国际美食休闲街等多个主题 mall 组成复合体
#     （来源：[砂之船校园招聘介绍](http://campus.51job.com/sasseur/index.htm)、
#      [兰州砂之船公司简介](http://www.zhaopin.com/companydetail/CZ844560370.htm)，内容已改写以符合授权要求）。
#   - 砂之船房地产投资信托（Sasseur REIT）2018 年 3 月于新交所主板上市，为亚洲首只奥莱 REIT，
#     初始组合含 4 个奥莱：重庆两江、重庆璧山、合肥、昆明；母公司体系内另有更多在营奥莱
#     （来源：[Sasseur REIT 官网](https://www.sasseurreit.com/)）。
#   - 典型年度营销节点：年庆大促（Anniversary Sales）、国庆黄金周、Red Festival、年末大促
#     （来源：[KGI FY25 研究报告](https://www.kgieworld.sg/securities/resources/ck/files/docs/research/SASSEUR%20REIT%20FY25%20UPDATE%20REPORT.pdf)、
#      [Sasseur REIT 年庆销售公告报道](https://www.tipranks.com/news/company-announcements/sasseur-reit-reports-robust-sales-growth-at-anniversary-event)、
#      [黄金周销售公告](https://links.sgx.com/1.0.0/corporate-announcements/CQNRTJ1E7NT09E57/821867_Sasseur_REIT_Achieves_Record_RMB276.1_Million_Sales.pdf)，内容已改写以符合授权要求）。
#   ⚠️ 以上仅用于本体命名与别名对齐，不作为 ABox 事实写入；具体门店/折扣/价格一律以入库语料为准。
#
# ⚠️ 抽取要求（供 OntologyExtractor 提示，直接对应本领域的召回短板）：
#   1) 「折扣与优惠规则」必须**逐条穷举**：同一活动下不同品牌/品类/楼层的折扣不同，
#      不要只抽一句「全场低至 3 折」；满减门槛、封顶、是否可叠加、券的有效期、
#      是否会员专享、线上线下适用范围，每条都要成为独立 Promotion 实体。
#   2) 「价格」必须区分 original_price（吊牌价/专柜价）与 outlet_price（奥莱价/到手价），
#      并保留币种与单位；出现「叠加券后到手」时用 final_price 记录，避免三者混淆。
#   3) 「穿搭 Look」必须按**部位穷举单品**（外套/上装/下装/鞋/包/配饰），
#      每件单品尽量补齐品类、品牌、颜色、面料、廓形、尺码建议，缺失留空而非猜测。
#   4) 「时间」区分活动周期（start_date/end_date）与视频内时间点（时间戳类信息不入本体）。
#   5) 「适配性结论」（显瘦/挡风/适合梨形身材/黄皮友好）必须落到 StylingRule 或
#      SUITABLE_FOR_* 关系上，不要只写进自由文本，否则无法图查询。
#   6) 「业绩与客流数字」统一进 Metric（含 period/scope/yoy_growth），
#      并标注 accuracy_mark，区分官方口径与博主估算。

version: 1
domain: sasseur_fashion

entity_types:
  # ── 主体：集团 / 品牌 / 人 ───────────────────────────────
  - name: Organization
    aliases: ["公司", "集团", "企业", "运营方", "管理公司", "开发商", "业主", "投资信托", "REIT", "品牌方", "代理商", "经销商", "MCN", "机构", "赞助商", "合作方"]
    attributes:
      - { name: legal_name, type: string, required: false, description: "法定全称或官方名称，如砂之船（集团）控股有限公司" }
      - { name: org_type, type: enum, required: false, description: "类型：group/operator/landlord/reit/brand_owner/agent/distributor/mcn/agency/sponsor/media" }
      - { name: business_model, type: text, required: false, description: "商业模式或经营理念描述，如艺术商业 / (1+N)×数据 / EMA 租约模式" }
      - { name: country, type: string, required: false, description: "所属国家/地区" }
      - { name: listing_venue, type: string, required: false, description: "上市地与代码，如 SGX Mainboard / CRPU.SI" }
      - { name: listing_date, type: date, required: false, description: "上市或成立日期" }
      - { name: portfolio_size, type: string, required: false, description: "管理项目规模，如组合内 4 个奥莱 / 体系内 19 个奥莱" }
      - { name: website, type: string, required: false, description: "官方网站或官方账号" }

  - name: Brand
    aliases: ["品牌", "牌子", "商标", "入驻品牌", "签约品牌", "国际品牌", "国潮品牌", "运动品牌", "奢侈品牌", "轻奢品牌", "设计师品牌", "买手品牌"]
    attributes:
      - { name: brand_en, type: string, required: false, description: "品牌英文/原文名，如 Nike/COACH/MaxMara，用于消歧与别名合并" }
      - { name: brand_tier, type: enum, required: false, description: "定位层级：luxury/light_luxury/designer/international_sports/national_trend/mass/fast_fashion/kids/outdoor" }
      - { name: category_focus, type: string, required: false, description: "主营品类，如女装/男装/运动鞋服/箱包/童装/家居" }
      - { name: country_of_origin, type: string, required: false, description: "品牌来源国/地区" }
      - { name: price_band, type: string, required: false, description: "价格带，如 300-800 元 / 千元级 / 万元级" }
      - { name: typical_discount, type: string, required: false, description: "该品牌在奥莱的常规折扣区间，如 5-7 折 / 低至 2 折" }
      - { name: is_anchor_tenant, type: boolean, required: false, description: "是否为主力店/品牌（对客流有带动作用）" }
      - { name: target_audience, type: string, required: false, description: "目标客群，如 25-35 岁都市女性 / 亲子家庭 / 户外爱好者" }

  - name: Person
    aliases: ["人", "人物", "博主", "达人", "网红", "KOL", "主播", "造型师", "买手", "设计师", "店长", "导购", "嘉宾", "艺人", "主持人", "模特", "顾客", "消费者"]
    attributes:
      - { name: role, type: enum, required: false, description: "角色：blogger/kol/host/stylist/buyer/designer/store_manager/sales/guest/celebrity/model/customer/executive" }
      - { name: platform, type: string, required: false, description: "活跃平台，如小红书/抖音/视频号/B站" }
      - { name: follower_count, type: string, required: false, description: "粉丝量级，如 12.6 万" }
      - { name: content_style, type: string, required: false, description: "内容风格，如平价穿搭/通勤通勤穿搭/奥莱捡漏/亲子探店" }
      - { name: height, type: string, required: false, description: "身高（含单位），穿搭参考用，如 162cm" }
      - { name: weight, type: string, required: false, description: "体重（含单位），穿搭参考用，如 52kg" }
      - { name: usual_size, type: string, required: false, description: "日常尺码，如上身 M / 下身 27 码 / 鞋 38" }
      - { name: affiliation, type: string, required: false, description: "所属机构/品牌/商场" }

  # ── 场所：综合体 / 分区 / 门店 ───────────────────────────
  - name: Mall
    aliases: ["商场", "奥莱", "奥特莱斯", "购物中心", "商业综合体", "商业广场", "艺术商业广场", "购物村", "项目", "门店集群", "outlets"]
    attributes:
      - { name: mall_type, type: enum, required: false, description: "类型：outlet/shopping_village/art_commercial_plaza/mall/kids_mall/food_street/complex" }
      - { name: city, type: string, required: false, description: "所在城市，如重庆/合肥/昆明/南京/长沙/兰州" }
      - { name: district, type: string, required: false, description: "所在区域或商圈，如两江新区/璧山/望城区/江北新区" }
      - { name: address, type: string, required: false, description: "详细地址" }
      - { name: opening_date, type: date, required: false, description: "开业日期（年庆届数推算的基准）" }
      - { name: gross_leasable_area, type: string, required: false, description: "可租面积/建筑面积（含单位），如 约 310,241 ㎡（组合合计）" }
      - { name: floor_count, type: string, required: false, description: "楼层数或楼层区间，如 B1-4F" }
      - { name: brand_count, type: string, required: false, description: "入驻品牌数量，如 400+ 品牌" }
      - { name: occupancy_rate, type: string, required: false, description: "出租率，如 98.5% / 100%" }
      - { name: positioning, type: text, required: false, description: "定位与业态构成描述，如奥莱+意大利购物村+儿童世界+美食街四大主题 mall" }
      - { name: transport, type: text, required: false, description: "交通与停车信息，如地铁 X 号线/免费停车 2 小时/摆渡车班次" }
      - { name: opening_hours, type: string, required: false, description: "营业时间，如 10:00-22:00，大促期间延长至 23:00" }
      - { name: annual_sales, type: string, required: false, description: "年度销售额（含币种），如 RMB 2.x 十亿" }

  - name: Zone
    aliases: ["分区", "业态分区", "主题馆", "楼层", "区域", "馆", "街区", "中庭", "广场", "意大利购物村", "儿童世界", "美食街", "运动馆", "潮流馆", "艺术中心"]
    attributes:
      - { name: zone_type, type: enum, required: false, description: "类型：luxury/womenswear/menswear/sports/outdoor/kids/accessories/beauty/food/entertainment/art/atrium/service" }
      - { name: floor, type: string, required: false, description: "所在楼层，如 1F/2F/B1" }
      - { name: theme, type: string, required: false, description: "主题定位，如意大利购物村 / 国际美食休闲街" }
      - { name: brand_mix, type: text, required: false, description: "该分区主要品牌构成描述" }
      - { name: navigation_tip, type: text, required: false, description: "逛店动线建议，如先 2F 运动再下 1F 女装，避开中庭人流" }

  - name: Store
    aliases: ["门店", "店铺", "专卖店", "专柜", "旗舰店", "集合店", "折扣店", "工厂店", "快闪店", "店中店", "柜台"]
    attributes:
      - { name: store_type, type: enum, required: false, description: "类型：flagship/standard/multi_brand/factory_outlet/pop_up/shop_in_shop/counter" }
      - { name: floor, type: string, required: false, description: "所在楼层" }
      - { name: unit_no, type: string, required: false, description: "铺位号，如 1F-A012" }
      - { name: area, type: string, required: false, description: "店铺面积（含单位）" }
      - { name: opening_date, type: date, required: false, description: "开业/入驻日期" }
      - { name: stock_depth, type: text, required: false, description: "货品深度与断码情况，如尺码齐全 / 仅剩 S 与 XL / 上季款为主" }
      - { name: service_note, type: text, required: false, description: "服务信息，如可改裤长、支持退换、试衣间排队约 10 分钟" }

  - name: Location
    aliases: ["地点", "位置", "城市", "区县", "商圈", "地铁站", "停车场", "周边"]
    attributes:
      - { name: location_type, type: enum, required: false, description: "类型：city/district/business_circle/station/parking/landmark" }
      - { name: address, type: string, required: false, description: "地址或所在区域" }
      - { name: distance_note, type: string, required: false, description: "距离/耗时描述，如距市区 25km、地铁转摆渡约 40 分钟" }

  # ── 活动：大促 / 年庆 / 现场活动 / 优惠 / 会员 ────────────
  - name: Campaign
    aliases: ["活动", "大促", "促销活动", "营销活动", "年庆", "周年庆", "店庆", "奥莱节", "购物节", "折扣季", "清仓", "黄金周", "双十一", "年末大促", "开季活动", "招商活动"]
    attributes:
      - { name: campaign_name, type: string, required: false, description: "活动官方名称，如「X 周年庆」「奥莱节」「红五月」「Red Festival」" }
      - { name: campaign_type, type: enum, required: false, description: "类型：anniversary/outlet_festival/holiday/season_sale/clearance/member_day/new_store_opening/livestream/joint_marketing" }
      - { name: edition, type: string, required: false, description: "届数/期数，如第 12 届 / 2026 春季场" }
      - { name: start_date, type: date, required: false, description: "开始日期" }
      - { name: end_date, type: date, required: false, description: "结束日期" }
      - { name: duration, type: string, required: false, description: "持续时长，如 10 天 / 国庆 7 天假期" }
      - { name: theme, type: string, required: false, description: "活动主题，如「艺术生活节」「秋冬焕新」" }
      - { name: slogan, type: string, required: false, description: "活动口号/主视觉文案" }
      - { name: scope, type: enum, required: false, description: "覆盖范围：single_mall/multi_mall/nationwide/online_only/omni_channel" }
      - { name: participating_brand_count, type: string, required: false, description: "参与品牌数量，如 300+ 品牌参与" }
      - { name: headline_discount, type: string, required: false, description: "主打折扣表述，如「低至 2 折」「折上 8 折」" }
      - { name: channels, type: string, required: false, description: "投放与参与渠道，如小程序/公众号/抖音直播/门店现场" }
      - { name: target_audience, type: string, required: false, description: "目标客群" }
      - { name: first_day_sales, type: string, required: false, description: "首日销售额（含币种），如 RMB 233.9 百万" }
      - { name: total_sales, type: string, required: false, description: "活动期总销售额（含币种）" }
      - { name: yoy_growth, type: string, required: false, description: "同比增幅，如 +30% / 近 28%" }
      - { name: footfall, type: string, required: false, description: "客流量，如 单日 12 万人次" }
      - { name: is_recurring, type: boolean, required: false, description: "是否为年度固定节点（年庆/黄金周为 true）" }

  - name: Event
    aliases: ["现场活动", "演出", "演艺", "秀", "时装秀", "走秀", "发布会", "展览", "艺术展", "快闪", "工作坊", "亲子活动", "抽奖", "直播", "签售", "见面会", "沙龙", "打卡"]
    attributes:
      - { name: event_type, type: enum, required: false, description: "类型：fashion_show/exhibition/pop_up/workshop/performance/lottery/livestream/meetup/kids_activity/checkin_photo/press_conference" }
      - { name: date, type: date, required: false, description: "举办日期" }
      - { name: time_slot, type: string, required: false, description: "场次时间，如 每日 15:00 与 19:30 两场" }
      - { name: venue, type: string, required: false, description: "举办地点，如中庭 / 1F 意大利购物村广场" }
      - { name: host, type: string, required: false, description: "主办/承办方" }
      - { name: guest, type: string, required: false, description: "嘉宾/艺人/达人" }
      - { name: attendance, type: string, required: false, description: "参与人数/观演人数" }
      - { name: participation_rule, type: text, required: false, description: "参与规则，如消费满 500 元可换取一次抽奖资格" }
      - { name: reward, type: text, required: false, description: "奖品/礼品，如限量帆布袋、100 元无门槛券" }

  - name: Promotion
    aliases: ["优惠", "折扣", "满减", "券", "优惠券", "代金券", "礼券", "满赠", "返现", "折上折", "会员价", "特价", "秒杀", "第二件半价", "积分兑换", "以旧换新"]
    attributes:
      - { name: promo_type, type: enum, required: false, description: "类型：discount/threshold_off/coupon/gift_with_purchase/cashback/second_item/flash_sale/points_redeem/trade_in/member_price/bundle" }
      - { name: discount_expression, type: string, required: false, description: "折扣或优惠原始表述（保留原文），如「低至 3 折」「满 1000 减 300」「折后再 8 折」" }
      - { name: threshold, type: string, required: false, description: "门槛，如单笔满 1000 元 / 累计满 3 件" }
      - { name: cap, type: string, required: false, description: "封顶或限制，如每人限领 2 张 / 单笔最高减 500 元" }
      - { name: applicable_scope, type: text, required: false, description: "适用范围，如指定女装品牌 / 不含黄金珠宝与折扣商品" }
      - { name: excluded_scope, type: text, required: false, description: "除外范围（单独抽取，避免与适用范围混淆）" }
      - { name: stackable, type: boolean, required: false, description: "是否可与其他优惠叠加" }
      - { name: valid_period, type: string, required: false, description: "有效期，如 3.8-3.15 / 领取后 7 天内" }
      - { name: channel, type: enum, required: false, description: "领取或使用渠道：offline/miniprogram/app/livestream/third_party/wechat" }
      - { name: member_only, type: boolean, required: false, description: "是否会员专享" }
      - { name: quantity_limit, type: string, required: false, description: "数量限制/库存，如限量 500 份，先到先得" }

  - name: MembershipTier
    aliases: ["会员", "会员等级", "等级", "银卡", "金卡", "白金卡", "黑卡", "VIP", "SVIP", "积分体系"]
    attributes:
      - { name: tier_name, type: string, required: false, description: "等级名称" }
      - { name: upgrade_threshold, type: string, required: false, description: "升级门槛，如年度累计消费 20000 元" }
      - { name: points_rate, type: string, required: false, description: "积分倍率，如 1 元 1 分 / 大促期间 3 倍积分" }
      - { name: benefits, type: text, required: false, description: "权益清单，如生日券、专属折扣、免费停车、休息室、优先入场" }
      - { name: validity, type: string, required: false, description: "有效期与保级规则" }

  - name: Metric
    aliases: ["指标", "数据", "业绩", "销售额", "客流", "出租率", "坪效", "客单价", "转化率", "同比", "环比", "会员数", "增长率"]
    attributes:
      - { name: metric_name, type: string, required: false, description: "指标名称，如销售额/客流量/出租率/客单价/坪效/会员数/排队时长/停车费" }
      - { name: value, type: string, required: false, description: "数值（含单位与币种），如 RMB 276.1 百万 / 98.5% / 12 万人次" }
      - { name: unit, type: string, required: false, description: "计量单位" }
      - { name: period, type: string, required: false, description: "统计周期，如 2024 年国庆 7 天 / 1Q2026 / 年庆首日" }
      - { name: scope, type: string, required: false, description: "统计范围，如 4 店合计 / 重庆两江店 / 某品牌门店" }

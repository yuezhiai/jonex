  - name: HAS_ZONE
    source: Mall
    target: Zone
    description: "项目包含某主题馆/业态分区/楼层（如意大利购物村、儿童世界、国际美食休闲街）"

  - name: HAS_STORE
    source: Mall
    target: Store
    description: "项目内设有某门店"

  - name: STORE_IN_ZONE
    source: Store
    target: Zone
    description: "门店位于某分区/楼层，用于动线与逛店路线推理"

  - name: STORE_OF_BRAND
    source: Store
    target: Brand
    description: "门店隶属于某品牌（品牌 × 项目的具体落位）"

  - name: BRAND_OWNED_BY
    source: Brand
    target: Organization
    description: "品牌归属于某集团/代理商/经销商"

  - name: ANCHOR_TENANT_OF
    source: Brand
    target: Mall
    description: "品牌是某项目的主力店/招牌品牌"

  - name: COMPETES_WITH
    source: Mall
    target: Mall

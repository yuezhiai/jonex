  # ── 单品构成与属性 ─────────────────────────────────────
  - name: SOLD_BY_BRAND
    source: ApparelItem
    target: Brand
    description: "单品属于某品牌"

  - name: AVAILABLE_AT
    source: ApparelItem
    target: Store
    description: "单品在某门店在售（含断码情况写入 Store.stock_depth 或单品 size_range）"

  - name: MADE_OF
    source: ApparelItem
    target: Material
    description: "单品使用某面料/材质（多成分时逐个建边）"

  - name: HAS_COLOR
    source: ApparelItem
    target: Color
    description: "单品具有某颜色（多色可选时逐色建边）"

  - name: HAS_PATTERN
    source: ApparelItem
    target: Pattern
    description: "单品带某图案/花纹"

  - name: HAS_SIZE_SPEC
    source: ApparelItem
    target: SizeSpec
    description: "单品具有某尺码及其净尺寸数据"

  - name: ACCESSORY_MADE_OF
    source: Accessory
    target: Material
    description: "配饰使用某材质"

  - name: SUBSTITUTE_OF
    source: ApparelItem
    target: ApparelItem
    description: "平替关系：以更低价位实现相近效果（奥莱语料高频，需保留价差理由）"

  - name: UPGRADE_OF
    source: ApparelItem
    target: ApparelItem
    description: "升级款/同系列更高定位替代（区别于平替方向）"

  # ── 搭配与适配 ─────────────────────────────────────────
  - name: INCLUDES_ITEM
    source: Outfit
    target: ApparelItem
    description: "整套搭配包含某服装单品（按部位逐件穷举：外套/上装/下装/内搭）"

  - name: INCLUDES_ACCESSORY
    source: Outfit
    target: Accessory

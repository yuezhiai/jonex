  - name: NOT_SUITABLE_FOR_BODY
    source: ApparelItem
    target: BodyType
    description: "单品不建议某体型选择（如短款廓形上衣不利于苹果形遮胃）"

  - name: COLOR_SUITS_SKIN_TONE
    source: Color
    target: SkinTone
    description: "颜色适配某肤色/色彩季型"

  - name: COLOR_PAIRS_WITH
    source: Color
    target: Color
    description: "颜色之间的配色关系（同色系/邻近色/撞色），承载配色方案推理"

  - name: FOLLOWS_RULE
    source: Outfit
    target: StylingRule
    description: "搭配遵循某搭配法则（如三色原则、上短下长）"

  - name: VIOLATES_RULE
    source: Outfit
    target: StylingRule
    description: "搭配违背某法则（用于反面案例与避坑说明）"

  - name: RULE_APPLIES_TO_BODY
    source: StylingRule
    target: BodyType
    description: "搭配法则针对某体型生效"

  - name: FOR_SEASON
    source: Outfit
    target: Season
    description: "搭配适用于某季节/节令"

  - name: ITEM_FOR_SEASON
    source: ApparelItem
    target: Season
    description: "单品适穿季节（配合 temperature_range 使用）"

  # ── 趋势、内容与活动的连接 ───────────────────────────────
  - name: REFLECTS_TREND
    source: Outfit
    target: Trend
    description: "搭配体现某流行趋势"

  - name: ITEM_REFLECTS_TREND
    source: ApparelItem
    target: Trend
    description: "单品体现某流行趋势/爆款元素"

  - name: TREND_IN_SEASON
    source: Trend
    target: Season
    description: "趋势属于某季节/季标"

  - name: RECOMMENDED_BY
    source: Outfit
    target: Person
    description: "搭配由某博主/造型师/店长推荐（区分推荐主体，便于溯源）"

  - name: STYLED_FROM_CAMPAIGN
    source: Outfit
    target: Campaign
    description: "搭配来自某次活动/大促现场（如年庆探店成套搭配）"

  - name: SHOT_AT
    source: Outfit
    target: Mall
    description: "搭配在某项目/门店拍摄或选购完成"

  - name: TARGETS_AUDIENCE
    source: Campaign
    target: Concept
    description: "活动面向某客群标签（如亲子家庭、Z 世代、通勤白领）"

  - name: RELATES_TO
    source: Concept
    target: Concept
    description: "概念之间的关联（兜底关系，避免强塞到具体关系上）"

constraints:
  - type: required_attribute
    entity: Campaign
    attribute: campaign_name
    severity: warning

  - type: required_attribute
    entity: Promotion
    attribute: discount_expression
    severity: warning

  - type: required_attribute
    entity: ApparelItem
    attribute: category
    severity: warning

  - type: required_attribute
    entity: Outfit
    attribute: occasion
    severity: warning

  - type: required_attribute
    entity: Mall
    attribute: city
    severity: warning

  - type: required_attribute
    entity: Metric
    attribute: value
    severity: warning

disambiguation:
  case_insensitive: true
  alias_merge: true
  # 常见歧义处理约定（供抽取阶段参考）：
  #   - 「砂之船」单独出现时按上下文判定指集团（Organization）还是具体项目（Mall）；
  #     出现城市/区县限定（重庆两江、璧山、合肥、昆明、南京江北、长沙望城等）一律建成 Mall。
  #   - 「意大利购物村」「儿童世界」「国际美食休闲街」是同一综合体下的 Zone，不要建成独立 Mall。
  #   - 「年庆」「周年庆」「店庆」归一到同一 Campaign（campaign_type=anniversary），届数写入 edition。
  #   - 品牌中英文名（如 COACH / 蔻驰）通过 Brand.brand_en 合并，别建两个实体。
  #   - 「折扣」若描述整场活动写入 Campaign.headline_discount，若为具体规则一律建 Promotion 实体。

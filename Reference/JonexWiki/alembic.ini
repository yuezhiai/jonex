# ============================================================
# Jonex Wiki 引擎 Alembic 配置
# ============================================================
# 仓库里原先缺这个文件（Dockerfile 与本文件 README 都按它存在来写），
# 本地跑 `alembic upgrade head` 会直接失败，这里补齐。
#
# 注意：真实连接串不在此处配置。src/jonex_wiki/storage/migrations/env.py 会
# 自建 Settings() 并从 DB_HOST/DB_PORT/DB_USERNAME/DB_PASSWORD/DB_NAME
# （或显式 DATABASE_URL）拼装 URL，再按 DB_SCHEMA（默认 jonex_wiki）设 search_path。
# online 与 offline（alembic upgrade --sql）两种模式都从环境变量读取，本文件
# 不存放任何连接串/密码 —— 避免明文密码入库，且与上游源码保持一致。
# ============================================================
[alembic]
script_location = jonex_wiki:storage/migrations
# sqlalchemy.url 留空：由 env.py 读环境变量（Settings.database_url）动态提供
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[project]
name = "jonex-wiki"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29", "greenlet>=3.0", "alembic>=1.13", "pydantic>=2.0",
    "httpx>=0.27", "pydantic-settings>=2.3", "python-multipart>=0.0.9",
    "openai>=1.50", "jieba>=0.42", "structlog>=24.1",
]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "aiosqlite>=0.20", "alembic>=1.13"]
[project.scripts]
jonex-wiki-api = "jonex_wiki.main:run"
jonex-wiki-backfill = "jonex_wiki.backfill:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/jonex_wiki"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

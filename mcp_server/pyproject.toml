[project]
name = "mcp-server-jonex"
version = "0.1.0"
description = "Jonex 平台 - MCP Server（知识库 Tool 注册与鉴权）"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28.1,<2",
    "pydantic>=2.11.0",
    "slowapi>=0.1.9",
    "redis>=5.2.0",
    "asyncpg>=0.29.0",
    "uvicorn>=0.27.0",
    "httpx>=0.28.1",
    "starlette>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv]

[pytest]
asyncio_mode = auto
# 测试模块里有 `from tests.eval.nl2sql... import`（tests/ 是包，见 tests/__init__.py）。
# `uv run pytest` 走 console script、不把 cwd 放进 sys.path，必须显式补 rootdir。
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v
markers =
    integration: 集成测试（可能涉及外部依赖/真实构建，部分需显式 opt-in 触发）
    slow: 耗时较长的性能/基准测试，默认不执行，需要 -m slow 显式启用
